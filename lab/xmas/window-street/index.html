<style>
  :root { --ink: #1d2433; --paper: #f3eee4; --warm: #f5c46a; --z: 1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'Outfit', sans-serif; }
  #svg { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; }
  #svg.dragging { cursor: grabbing; }
  #svg path { stroke-linecap: round; stroke-linejoin: round; }
  #svg:not(.intro) .ink path { vector-effect: non-scaling-stroke; stroke-width: calc(1.4px * min(var(--z), 1.9)); }
  #svg:not(.intro) .scene path { vector-effect: non-scaling-stroke; stroke-width: calc(0.55px * min(var(--z), 5)); }
  #svg:not(.intro) .scene path[fill]:not([fill=none]) { stroke-width: 0; }
  .win { cursor: pointer; }
  .win .glass { transition: fill 1.2s, fill-opacity 1.2s; }
  .win:hover .glass { fill-opacity: .82; }
  .win.has-scene:hover .glass { filter: brightness(1.08); }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s;
              background: radial-gradient(ellipse at center, transparent 45%, rgba(243,238,228,.0) 55%, rgba(243,238,228,.75) 100%); }
  .zoomed .vignette { opacity: 1; }
  .head { position: fixed; top: 24px; left: 24px; pointer-events: none; transition: opacity .6s; }
  .head h1 { font-weight: 200; font-size: clamp(22px, 4vw, 32px); letter-spacing: .3em; }
  .head p { margin-top: 8px; font-size: 13px; font-weight: 300; opacity: .65; letter-spacing: .06em; }
  .zoomed .head { opacity: 0; }
  .back { position: fixed; top: 24px; right: 24px; color: var(--ink); opacity: .6; text-decoration: none; font-size: 13px; letter-spacing: .1em; }
  .caption { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%) translateY(10px); opacity: 0; transition: opacity 1s .6s, transform 1s .6s;
             font-family: 'Shippori Mincho', serif; font-size: clamp(15px, 2.2vw, 20px); letter-spacing: .12em; text-align: center;
             width: min(90vw, 640px); line-height: 1.9; pointer-events: none; text-shadow: 0 0 12px var(--paper), 0 0 4px var(--paper); }
  .zoomed .caption { opacity: 1; transform: translateX(-50%); }
  .nav { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: none; gap: 6px; white-space: nowrap; }
  .zoomed .nav { display: flex; }
  .nav button { font: inherit; font-size: 13px; letter-spacing: .08em; background: rgba(243,238,228,.85); color: var(--ink); border: 1px solid rgba(29,36,51,.25);
                border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .nav button:hover { background: #fff; }
  .found { position: fixed; right: 24px; bottom: 22px; font-size: 12px; letter-spacing: .1em; opacity: .55; font-variant-numeric: tabular-nums; }
  .zoomed .found { opacity: 0; }

  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,1.05); } }
  @keyframes flicker { 0%,100% { transform: scale(1,1); opacity: 1; } 30% { transform: scale(.92,1.08); } 60% { transform: scale(1.05,.94); opacity: .85; } }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: .55; } 100% { transform: translateY(-70px) scale(1.8); opacity: 0; } }
  @keyframes steam { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
  @keyframes sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .6; transform: scale(.85); } }
  @keyframes floaty { 0% { transform: translateY(0); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
  @keyframes fog { 0%,100% { opacity: .15; transform: scale(.7); } 45% { opacity: .75; transform: scale(1.05); } }
  @keyframes write { 0%,100% { transform: translate(0,0); } 25% { transform: translate(2px,-1px); } 50% { transform: translate(4px,0); } 75% { transform: translate(2px,1px); } }
  .anim { transform-box: fill-box; transform-origin: center; }
  .breathe { animation: breathe 3.2s ease-in-out infinite; transform-origin: center bottom; }
  .flicker { animation: flicker .5s ease-in-out infinite; transform-origin: center bottom; }
  .smoke { animation: rise 4s linear infinite; }
  .steam { animation: steam 2.4s ease-in infinite; }
  .sway { animation: sway 2.6s ease-in-out infinite; transform-origin: center bottom; }
  .twinkle { animation: twinkle 1.6s ease-in-out infinite; }
  .floaty { animation: floaty 2.8s ease-out infinite; }
  .fog { animation: fog 3.4s ease-in-out infinite; }
  .write { animation: write .9s linear infinite; }
</style>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>

<body>
<svg id="svg" class="intro" preserveAspectRatio="xMidYMid meet"></svg>
<canvas id="snow"></canvas>
<div class="vignette"></div>
<div class="head">
  <h1>WINDOW STREET</h1>
  <p>灯りのついた窓をクリックすると、中が覗ける ・ ドラッグで通りを歩く</p>
</div>
<a class="back" href="../">← index</a>
<div class="caption" id="caption"></div>
<div class="nav">
  <button id="prevBtn">← 前の窓</button>
  <button id="outBtn">通りにもどる</button>
  <button id="nextBtn">次の窓 →</button>
</div>
<div class="found" id="found"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const rc = rough.svg(svg);
const INK = '#1d2433', PAPER = '#f3eee4', WARM = '#f5c46a', RED = '#c4473a', GREEN = '#4f6e58', GOLD = '#d9a33b';
const W = 2600, H = 800, GROUND = 640;

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(1224);
const R = (a, b) => a + (b - a) * rand();

let seed = 1;
const opt = (x = {}) => ({ stroke: INK, strokeWidth: 1.5, roughness: 1.1, bowing: 1.2, seed: seed++, ...x });
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const group = (parent, cls) => el('g', cls ? { class: cls } : {}, parent);

// 描画ヘルパー（rough.jsで手描き風）
const D = g => ({
  rect: (x, y, w, h, o) => g.appendChild(rc.rectangle(x, y, w, h, opt(o))),
  circle: (x, y, d, o) => g.appendChild(rc.circle(x, y, d, opt(o))),
  ellipse: (x, y, w, h, o) => g.appendChild(rc.ellipse(x, y, w, h, opt(o))),
  line: (x1, y1, x2, y2, o) => g.appendChild(rc.line(x1, y1, x2, y2, opt(o))),
  path: (d, o) => g.appendChild(rc.path(d, opt(o))),
  poly: (pts, o) => g.appendChild(rc.polygon(pts, opt(o))),
});

// ---------- レイヤー ----------
const defs = el('defs', {}, svg);
const sky = group(svg, 'ink');
const back = group(svg, 'ink');
const street = group(svg, 'ink');
const fx = group(svg);

// ---------- 空 ----------
{
  const d = D(sky);
  d.circle(2050, 150, 110, { fill: '#fbf6ea', fillStyle: 'solid' });
  d.path('M2030 115 q-14 20 2 44', { strokeWidth: 1, roughness: 0.6 });
  for (let i = 0; i < 70; i++) {
    const x = R(0, W), y = R(20, 330), s = R(3, 7);
    if (Math.hypot(x - 2050, y - 150) < 90) continue;
    d.line(x - s, y, x + s, y, { strokeWidth: 1, roughness: 0.4 }); d.line(x, y - s, x, y + s, { strokeWidth: 1, roughness: 0.4 });
  }
}
// 遠くの丘と森
{
  const d = D(back);
  let p = `M0 ${GROUND - 70}`;
  for (let x = 0; x <= W; x += 120) p += ` Q${x + 60} ${GROUND - 120 - R(0, 50)} ${x + 120} ${GROUND - 75 - R(0, 30)}`;
  d.path(p, { strokeWidth: 1, roughness: 1.5 });
  for (let x = 30; x < W; x += R(26, 60)) {
    const h = R(28, 55), y = GROUND - 82 - R(0, 18);
    d.poly([[x, y - h], [x - h * 0.32, y], [x + h * 0.32, y]], { strokeWidth: 1, roughness: 1.2 });
  }
  back.setAttribute('opacity', '0.35');
}

// ---------- 通り ----------
const windows = [];
const ds = D(street);

function snowCap(points, depth) {
  // 屋根の線に沿った雪の帽子（下辺をでこぼこに）
  let top = `M${points[0][0]} ${points[0][1]}`;
  for (let i = 1; i < points.length; i++) top += ` L${points[i][0]} ${points[i][1]}`;
  let bottom = '';
  for (let i = points.length - 1; i > 0; i--) {
    const [x1, y1] = points[i], [x0, y0] = points[i - 1];
    const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 34));
    for (let k = 1; k <= n; k++) {
      const t = k / n, x = x1 + (x0 - x1) * t, y = y1 + (y0 - y1) * t + depth + (k % 2 ? R(4, 12) : 0);
      bottom += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
    }
  }
  ds.path(top + bottom + ' Z', { fill: '#fffdf8', fillStyle: 'solid', strokeWidth: 1.4 });
}

function chimney(x, y) {
  ds.rect(x, y - 46, 26, 46, { fill: PAPER, fillStyle: 'solid' });
  ds.rect(x - 4, y - 52, 34, 8, { fill: '#fffdf8', fillStyle: 'solid' });
  for (let i = 0; i < 4; i++) {
    const c = el('circle', { cx: x + 13, cy: y - 62, r: 9, fill: 'none', stroke: INK, 'stroke-width': 1, opacity: 0, class: 'anim smoke' }, fx);
    c.style.animationDelay = `${i}s`;
  }
}

function addWindow(x, y, w, h) {
  const g = group(street, 'win');
  const glass = el('rect', { x, y, width: w, height: h, fill: WARM, 'fill-opacity': 0, class: 'glass' }, g);
  const sceneG = group(g, 'scene');
  const clipId = `clip${windows.length}`;
  const cp = el('clipPath', { id: clipId }, defs); el('rect', { x, y, width: w, height: h }, cp);
  sceneG.setAttribute('clip-path', `url(#${clipId})`);
  const fr = D(g);
  fr.rect(x, y, w, h);
  const mull = group(g); const fm = D(mull);
  fm.line(x + w / 2, y, x + w / 2, y + h, { strokeWidth: 1.2 }); fm.line(x, y + h * 0.45, x + w, y + h * 0.45, { strokeWidth: 1.2 });
  fr.line(x - 6, y + h + 3, x + w + 6, y + h + 3);
  const win = { g, glass, sceneG, mull, x, y, w, h, lit: false, scene: null };
  g.addEventListener('click', e => { if (moved) return; e.stopPropagation(); onWindow(win); });
  windows.push(win);
  return win;
}

function door(x, w, h) {
  const y = GROUND - h;
  ds.path(`M${x} ${GROUND} L${x} ${y + w / 2} Q${x + w / 2} ${y - 4} ${x + w} ${y + w / 2} L${x + w} ${GROUND}`, { fill: PAPER, fillStyle: 'solid' });
  ds.circle(x + w - 9, GROUND - h * 0.45, 5, { fill: INK, fillStyle: 'solid' });
  // リース
  ds.circle(x + w / 2, y + w * 0.62, 24, { stroke: GREEN, strokeWidth: 3, roughness: 2 });
  ds.path(`M${x + w / 2 - 5} ${y + w * 0.62 + 12} l5 -4 l5 4`, { stroke: RED, strokeWidth: 2 });
}

function lamp(x) {
  ds.line(x, GROUND, x, GROUND - 150, { strokeWidth: 1.8 });
  ds.poly([[x - 12, GROUND - 150], [x + 12, GROUND - 150], [x + 8, GROUND - 178], [x - 8, GROUND - 178]], { fill: WARM, fillStyle: 'hachure', hachureGap: 4 });
  ds.path(`M${x - 14} ${GROUND - 178} L${x} ${GROUND - 192} L${x + 14} ${GROUND - 178}`);
  const gr = el('radialGradient', { id: `lg${x | 0}` }, defs);
  el('stop', { offset: '0', 'stop-color': WARM, 'stop-opacity': '0.55' }, gr); el('stop', { offset: '1', 'stop-color': WARM, 'stop-opacity': '0' }, gr);
  el('circle', { cx: x, cy: GROUND - 164, r: 70, fill: `url(#lg${x | 0})` }, fx);
}

function bigTree(cx) {
  const t = group(street); const d = D(t);
  d.rect(cx - 14, GROUND - 40, 28, 40, { fill: '#7b5a44', fillStyle: 'hachure', hachureGap: 5 });
  const tiers = [[GROUND - 40, 170, 120], [GROUND - 130, 140, 115], [GROUND - 215, 108, 105], [GROUND - 290, 74, 95]];
  for (const [base, half, h] of tiers) d.poly([[cx, base - h], [cx - half, base], [cx + half, base]], { fill: GREEN, fillStyle: 'hachure', hachureGap: 6, hachureAngle: -50 });
  for (const [base, half, h] of tiers) snowCap([[cx - half, base], [cx - half * 0.55, base - h * 0.45]], 6), snowCap([[cx + half * 0.55, base - h * 0.45], [cx + half, base]], 6);
  const cols = [RED, GOLD, '#4a77a8'];
  for (let i = 0; i < 26; i++) {
    const tier = tiers[i % 4], fy = R(0.25, 0.92), y = tier[0] - tier[2] * (1 - fy), half = tier[1] * fy * 0.85;
    d.circle(cx + R(-half, half), y, R(9, 14), { fill: cols[i % 3], fillStyle: 'solid', strokeWidth: 1 });
  }
  const sy = GROUND - 395, star = [];
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 11 : 26; star.push([cx + Math.cos(a) * r, sy + Math.sin(a) * r]); }
  const sg = group(street, 'anim twinkle'); D(sg).poly(star, { fill: GOLD, fillStyle: 'solid', strokeWidth: 1.4 });
  // プレゼント
  d.rect(cx - 120, GROUND - 34, 44, 34, { fill: RED, fillStyle: 'hachure', hachureGap: 5 }); d.line(cx - 98, GROUND - 34, cx - 98, GROUND);
  d.rect(cx + 80, GROUND - 46, 38, 46, { fill: '#4a77a8', fillStyle: 'hachure', hachureGap: 5 }); d.line(cx + 80, GROUND - 23, cx + 118, GROUND - 23);
  d.rect(cx + 40, GROUND - 24, 30, 24, { fill: GOLD, fillStyle: 'cross-hatch', hachureGap: 6 });
}

function house(x, w, h) {
  const top = GROUND - h, type = Math.floor(R(0, 4));
  ds.rect(x, top, w, h, { fill: PAPER, fillStyle: 'solid' });
  let roofPts;
  if (type === 0 || type === 1) {
    const rh = w * (type ? 0.75 : 0.45);
    roofPts = [[x - 16, top], [x + w / 2, top - rh], [x + w + 16, top]];
    ds.poly(roofPts, { fill: PAPER, fillStyle: 'solid' });
    ds.poly(roofPts, { fill: INK, fillStyle: 'hachure', hachureGap: 9, hachureAngle: 70, strokeWidth: 1.5 });
    chimney(x + w * 0.72, top - rh * 0.44 + 8);
    if (rh > 120) { const ww = 34; addWindow(x + w / 2 - ww / 2, top - rh * 0.48, ww, ww * 1.2); }
  } else if (type === 2) {
    const s = w / 5, st = 34; // 階段状の破風
    roofPts = [[x, top], [x, top - st], [x + s, top - st], [x + s, top - st * 2], [x + 2 * s, top - st * 2], [x + 2 * s, top - st * 3],
               [x + 3 * s, top - st * 3], [x + 3 * s, top - st * 2], [x + 4 * s, top - st * 2], [x + 4 * s, top - st], [x + w, top - st], [x + w, top]];
    ds.poly(roofPts, { fill: PAPER, fillStyle: 'solid' });
    addWindow(x + 2 * s + s / 2 - 17, top - st * 2.6, 34, 40);
  } else {
    roofPts = [[x - 8, top], [x + w + 8, top]];
    ds.rect(x - 8, top - 18, w + 16, 18, { fill: PAPER, fillStyle: 'solid' });
    roofPts = [[x - 8, top - 18], [x + w + 8, top - 18]];
    chimney(x + 30, top - 18);
  }
  snowCap(roofPts.length === 3 ? roofPts : roofPts, 12);

  const ww = 50, wh = 60, cols = Math.max(1, Math.min(3, Math.floor((w - 30) / 82))), rows = Math.max(1, Math.min(3, Math.floor((h - 120) / 96) + 1));
  const doorCol = Math.floor(R(0, cols));
  for (let c = 0; c < cols; c++) {
    const cx = x + (w / cols) * (c + 0.5);
    for (let r = 0; r < rows; r++) {
      if (r === 0 && c === doorCol) { door(cx - 26, 52, 98); continue; }
      const y = GROUND - 120 - r * 100 + (r === 0 ? 30 : 0);
      addWindow(cx - ww / 2, y - wh / 2, ww, wh);
    }
  }
}

// 通りを並べる
{
  let x = 50;
  while (x < W - 150) {
    if (x > 1150 && x < 1500) { lamp(1180); bigTree(1320); lamp(1460); x = 1520; continue; }
    const w = R(180, 290), h = R(210, 360);
    if (x + w > W - 40) break;
    house(x, w, h);
    x += w + R(30, 70);
    if (rand() < 0.35) { lamp(x - 15); x += 20; }
  }
  // 地面
  let g = `M-50 ${GROUND}`;
  for (let gx = 0; gx <= W + 50; gx += 80) g += ` Q${gx + 40} ${GROUND + R(-6, 8)} ${gx + 80} ${GROUND + R(-2, 4)}`;
  ds.path(g, { strokeWidth: 1.8 });
  for (let gx = 40; gx < W; gx += R(90, 200)) ds.path(`M${gx} ${GROUND + 40 + R(0, 50)} q30 -16 60 0`, { strokeWidth: 1, roughness: 1.4 });
  // 足あと
  for (let gx = 80; gx < W - 60; gx += 46) {
    const y = GROUND + 92 + Math.sin(gx * 0.004) * 18 + (gx / 46 % 2 ? 7 : -7);
    ds.ellipse(gx, y, 12, 6, { strokeWidth: 1, roughness: 0.8 });
  }
}

// ---------- 窓の中のシーン（ローカル座標 100×120） ----------
const SCENES = [
  { text: '猫はこの家で、いちばん暖かい場所を知っている', draw(d, g) {
      d.rect(6, 66, 26, 34); for (let i = 0; i < 4; i++) d.line(11 + i * 5.5, 70, 11 + i * 5.5, 96, { strokeWidth: 1 });
      d.ellipse(60, 104, 70, 16, { fill: RED, fillStyle: 'hachure', hachureGap: 3 });
      const cat = group(g, 'anim breathe'); const c = D(cat);
      c.ellipse(62, 90, 46, 24, { fill: PAPER, fillStyle: 'solid' }); c.circle(41, 84, 21, { fill: PAPER, fillStyle: 'solid' });
      c.path('M33 77 L34 67 L40 74 M43 74 L48 67 L50 77'); c.path('M35 85 q2 2 4 0 M43 85 q2 2 4 0');
      c.path('M84 92 Q98 86 92 102 Q84 108 68 102');
      ['z', 'z', 'Z'].forEach((s, i) => { const t = el('text', { x: 52 + i * 7, y: 66 - i * 8, 'font-size': 6 + i * 2, fill: INK, class: 'anim floaty', 'font-family': 'Outfit' }, g); t.textContent = s; t.style.animationDelay = `${i * 0.8}s`; });
    } },
  { text: 'ふたり分のスープが、まだ湯気を立てている', draw(d, g) {
      d.line(4, 92, 96, 92); d.line(14, 92, 14, 120); d.line(86, 92, 86, 120);
      d.circle(20, 52, 18, { fill: PAPER, fillStyle: 'solid' }); d.path('M20 61 Q10 78 13 92'); d.path('M18 70 Q27 80 35 86');
      d.circle(80, 50, 18, { fill: PAPER, fillStyle: 'solid' }); d.path('M71 48 Q80 35 89 48'); d.path('M80 59 Q90 76 87 92'); d.path('M82 70 Q73 80 65 86');
      d.rect(47, 72, 6, 20); const f = group(g, 'anim flicker'); D(f).path('M50 70 Q45 63 50 55 Q55 63 50 70 Z', { fill: WARM, fillStyle: 'solid' });
      d.path('M28 87 Q36 96 44 87 Z'); d.path('M56 87 Q64 96 72 87 Z');
      [[36, 0], [64, 1.2]].forEach(([x, dl]) => { const s = group(g, 'anim steam'); s.style.animationDelay = `${dl}s`; D(s).path(`M${x} 82 q-3 -5 0 -10 q3 -5 0 -10`, { strokeWidth: 1 }); });
    } },
  { text: '隠したつもりのプレゼント。廊下の向こうで、小さな目が見ている', draw(d, g) {
      d.line(78, 0, 78, 120); d.line(96, 0, 96, 120);
      d.circle(42, 32, 18, { fill: PAPER, fillStyle: 'solid' }); d.path('M33 28 Q42 18 51 28');
      d.path('M42 41 L42 84'); d.path('M42 84 L34 118 M42 84 L50 118'); d.path('M42 54 Q30 64 30 74 M42 54 Q36 66 36 74');
      d.rect(16, 72, 26, 20, { fill: RED, fillStyle: 'hachure', hachureGap: 3 }); d.line(29, 72, 29, 92); d.line(16, 82, 42, 82);
      d.path('M29 72 q-6 -7 -9 0 q4 3 9 0 q6 -7 9 0 q-4 3 -9 0');
      const kid = group(g, 'anim twinkle'); const k = D(kid);
      k.circle(86, 64, 14, { fill: PAPER, fillStyle: 'solid' }); k.circle(83, 63, 2, { fill: INK, fillStyle: 'solid' }); k.circle(89, 63, 2, { fill: INK, fillStyle: 'solid' });
    } },
  { text: '窓ガラスに、ちいさな息の跡', draw(d, g) {
      d.circle(50, 80, 58, { fill: PAPER, fillStyle: 'solid' }); d.path('M22 70 Q28 40 50 40 Q74 40 79 68');
      d.circle(40, 78, 6, { fill: INK, fillStyle: 'solid' }); d.circle(60, 78, 6, { fill: INK, fillStyle: 'solid' });
      d.circle(50, 96, 7); d.path('M30 88 q3 2 6 0 M64 88 q3 2 6 0', { stroke: RED });
      d.path('M10 112 q0 -16 9 -16 q9 0 9 16'); d.path('M72 112 q0 -16 9 -16 q9 0 9 16');
      el('ellipse', { cx: 50, cy: 100, rx: 18, ry: 9, fill: '#ffffff', class: 'anim fog' }, g);
      d.path('M80 20 l8 8 M88 20 l-8 8 M84 18 l0 12 M78 24 l12 0', { strokeWidth: 0.8 });
    } },
  { text: '音楽はかかっていない。でも、ふたりには聞こえている', draw(d, g) {
      const pair = group(g, 'anim sway'); const p = D(pair);

      p.path('M30 98 L28 116 M40 98 L42 116');
      p.circle(64, 34, 16, { fill: PAPER, fillStyle: 'solid' }); p.path('M57 30 Q64 22 71 30'); p.path('M64 42 L66 82'); p.path('M66 82 L60 116 M66 82 L72 116');
      p.path('M36 56 Q50 46 65 54'); p.path('M36 56 Q24 60 28 48'); p.path('M65 54 Q78 60 80 70');
      ['♪', '♫'].forEach((s, i) => { const t = el('text', { x: 10 + i * 72, y: 30 + i * 8, 'font-size': 10, fill: INK, class: 'anim floaty' }, g); t.textContent = s; t.style.animationDelay = `${i * 1.3}s`; });
    } },
  { text: '踏み台の上で、今年の星をつける', draw(d, g) {
      d.poly([[30, 40], [8, 80], [52, 80]], { fill: GREEN, fillStyle: 'hachure', hachureGap: 3 }); d.poly([[30, 62], [4, 108], [56, 108]], { fill: GREEN, fillStyle: 'hachure', hachureGap: 3 });
      d.rect(26, 108, 8, 12); [[20, 74, RED], [38, 70, GOLD], [16, 100, GOLD], [42, 96, RED], [30, 88, '#4a77a8']].forEach(([x, y, c]) => d.circle(x, y, 5, { fill: c, fillStyle: 'solid', strokeWidth: 0.8 }));
      d.rect(60, 100, 26, 6); d.line(63, 106, 63, 120); d.line(83, 106, 83, 120);
      d.circle(74, 52, 16, { fill: PAPER, fillStyle: 'solid' }); d.path('M74 60 L74 82'); d.path('M74 82 L68 100 M74 82 L80 100'); d.path('M74 66 Q56 56 38 40'); d.path('M74 68 L84 80');
      const s = group(g, 'anim twinkle'); const st = [];
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 3 : 7; st.push([33 + Math.cos(a) * r, 34 + Math.sin(a) * r]); }
      D(s).poly(st, { fill: GOLD, fillStyle: 'solid', strokeWidth: 0.8 });
    } },
  { text: '同じ本を、もう何度目かのクリスマスに読んでいる', draw(d, g) {
      el('path', { d: 'M10 40 L-10 120 L46 120 L28 40 Z', fill: WARM, opacity: 0.35 }, g);
      d.line(18, 40, 18, 116); d.poly([[8, 40], [28, 40], [24, 26], [12, 26]], { fill: WARM, fillStyle: 'hachure', hachureGap: 2.5 });
      d.path('M50 108 L50 62 Q50 40 70 40 Q92 40 92 62 L92 108 Z', { fill: '#d9c9a8', fillStyle: 'hachure', hachureGap: 4 });
      d.circle(70, 58, 17, { fill: PAPER, fillStyle: 'solid' }); d.circle(70, 46, 9, { fill: PAPER, fillStyle: 'solid' });
      d.circle(65, 60, 5, { strokeWidth: 0.8 }); d.circle(75, 60, 5, { strokeWidth: 0.8 });
      d.path('M70 67 Q60 86 64 104'); d.path('M56 84 L66 80 L76 84 L76 94 L66 90 L56 94 Z', { fill: '#fffdf8', fillStyle: 'solid' });
      d.circle(32, 110, 13, { fill: RED, fillStyle: 'hachure', hachureGap: 2.5 }); d.line(26, 98, 36, 112, { strokeWidth: 0.8 });
    } },
  { text: '「サンタさんへ」――書き出しのまま、三十分止まっている', draw(d, g) {
      d.line(4, 86, 96, 86); d.line(10, 86, 10, 120); d.line(90, 86, 90, 120);
      d.circle(28, 46, 18, { fill: PAPER, fillStyle: 'solid' }); d.path('M19 42 Q28 32 37 42'); d.path('M28 55 Q26 72 32 86'); d.path('M30 64 Q44 76 54 80');
      d.poly([[46, 84], [86, 84], [80, 76], [52, 76]], { fill: '#fffdf8', fillStyle: 'solid' });
      const t = el('text', { x: 54, y: 72, 'font-size': 5.5, fill: INK, 'font-style': 'italic', 'font-family': 'Shippori Mincho' }, g); t.textContent = 'サンタさんへ';
      const pen = group(g, 'anim write'); D(pen).line(56, 82, 63, 68, { strokeWidth: 1.6 });
      d.rect(84, 68, 5, 16); const f = group(g, 'anim flicker'); D(f).path('M86.5 67 Q83 61 86.5 55 Q90 61 86.5 67 Z', { fill: WARM, fillStyle: 'solid' });
    } },
];

// シーンを窓に割り当てる（通りにまんべんなく）
const sceneWins = [];
{
  const cand = windows.filter(w => w.w >= 44).sort((a, b) => a.x - b.x);
  const step = cand.length / SCENES.length;
  SCENES.forEach((s, i) => {
    const win = cand[Math.floor(i * step + step / 2)];
    win.scene = s; win.g.classList.add('has-scene');
    const inner = group(win.sceneG); inner.setAttribute('transform', `translate(${win.x} ${win.y}) scale(${win.w / 100})`);
    // カーテン
    const d = D(inner);
    d.path('M0 0 Q10 30 4 120', { stroke: RED, strokeWidth: 1 }); d.path('M100 0 Q90 30 96 120', { stroke: RED, strokeWidth: 1 });
    s.draw(d, inner);
    inner.querySelectorAll('path').forEach(p => p.closest('.scene') && 0);
    sceneWins.push(win);
  });
}
// 灯りのついた窓（シーンの窓は必ず点灯）
windows.forEach(w => { w.lit = !!w.scene || rand() < 0.4; });

// ---------- ビュー（パン＆ズーム） ----------
let aspect = innerWidth / innerHeight;
const overview = () => {
  let w = Math.min(H * aspect, W), h = w / aspect;
  if (aspect < 0.9) { h = Math.min(H, 900); w = h * aspect; }
  return { w, h, y: H - h };
};
let pan = 0, view = { x: 0, y: 0, w: 1000, h: 800 }, zoomed = null, tween = null;
function setView(v) {
  view = v;
  svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
  document.documentElement.style.setProperty('--z', (overview().w / v.w).toFixed(3));
}
function homeView() { const o = overview(); pan = Math.max(0, Math.min(W - o.w, pan)); return { x: pan, y: o.y, w: o.w, h: o.h }; }
function animateTo(target, dur = 1400, done) {
  const from = { ...view }, t0 = performance.now();
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  tween = now => {
    const t = Math.min(1, (now - t0) / dur), e = ease(t);
    setView({ x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, w: from.w + (target.w - from.w) * e, h: from.h + (target.h - from.h) * e });
    if (t >= 1) { tween = null; done && done(); }
  };
}
function zoomTo(win) {
  zoomed = win;
  let w = Math.max(win.w * 1.75, win.h * 1.9 * aspect), h = w / aspect;
  const target = { x: win.x + win.w / 2 - w / 2, y: win.y + win.h / 2 - h / 2 + h * 0.1, w, h };
  document.body.classList.add('zoomed');
  sceneWins.forEach(s => s.mull.style.opacity = s === win ? 0.35 : 1);
  document.getElementById('caption').textContent = '';
  setTimeout(() => { if (zoomed === win) document.getElementById('caption').textContent = win.scene.text; }, 50);
  win.seen = true; updateFound();
  animateTo(target, 1500);
}
function zoomOut() {
  if (!zoomed) return;
  pan = zoomed.x + zoomed.w / 2 - overview().w / 2;
  zoomed = null;
  document.body.classList.remove('zoomed');
  sceneWins.forEach(s => s.mull.style.opacity = 1);
  animateTo(homeView(), 1300);
}
function step(dir) {
  if (!zoomed) return;
  const i = sceneWins.indexOf(zoomed);
  zoomTo(sceneWins[(i + dir + sceneWins.length) % sceneWins.length]);
}
function onWindow(win) {
  if (zoomed) { zoomOut(); return; }
  if (win.scene) { zoomTo(win); return; }
  win.lit = !win.lit; paintWindow(win, 0);
}
function paintWindow(win, delay) {
  setTimeout(() => { win.glass.setAttribute('fill-opacity', win.lit ? 0.62 : 0); win.sceneG.style.opacity = win.lit ? 1 : 0; }, delay);
}
function updateFound() {
  const n = sceneWins.filter(w => w.seen).length;
  document.getElementById('found').textContent = n === sceneWins.length ? `のぞいた窓 ${n} / ${n} ・ ぜんぶ見つけた` : `のぞいた窓 ${n} / ${sceneWins.length}`;
}
document.getElementById('outBtn').onclick = zoomOut;
document.getElementById('prevBtn').onclick = () => step(-1);
document.getElementById('nextBtn').onclick = () => step(1);
addEventListener('keydown', e => {
  if (e.key === 'Escape') zoomOut();
  if (e.key === 'ArrowRight') zoomed ? step(1) : (pan += 120, animateTo(homeView(), 400));
  if (e.key === 'ArrowLeft') zoomed ? step(-1) : (pan -= 120, animateTo(homeView(), 400));
});

// ドラッグとホイールで通りを歩く
let drag = null, moved = false, lastInteract = 0;
svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, pan }; moved = false; lastInteract = performance.now(); });
addEventListener('pointermove', e => {
  if (!drag || zoomed) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 4) { moved = true; svg.classList.add('dragging'); }
  if (moved) { pan = drag.pan - dx * view.w / innerWidth; tween = null; setView(homeView()); }
});
addEventListener('pointerup', () => { drag = null; svg.classList.remove('dragging'); setTimeout(() => moved = false, 0); });
svg.addEventListener('click', () => { if (!moved && zoomed) zoomOut(); });
svg.addEventListener('wheel', e => {
  e.preventDefault(); if (zoomed) return;
  lastInteract = performance.now();
  pan += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * view.w / innerWidth; tween = null; setView(homeView());
}, { passive: false });

// ---------- 雪（画面手前のレイヤー） ----------
const cv = document.getElementById('snow'), cx = cv.getContext('2d');
let flakes = [];
function resizeSnow() {
  const dpr = Math.min(devicePixelRatio, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  flakes = Array.from({ length: Math.round(innerWidth * innerHeight / 6000) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 2.2 + 0.6, s: Math.random() * 0.6 + 0.3, p: Math.random() * 100 }));
}
let zoomAmt = 1, lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (tween) tween(now);
  // 何もしていない時はゆっくり通りを流す
  if (!zoomed && !drag && !tween && now - lastInteract > 6000 && !svg.classList.contains('intro')) {
    pan += dt * 14; if (pan >= W - overview().w) pan = W - overview().w; setView(homeView());
  }
  const z = overview().w / view.w; zoomAmt += (z - zoomAmt) * 0.1;
  const big = Math.min(3, 0.7 + zoomAmt * 0.3);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  cx.fillStyle = '#ffffff'; cx.strokeStyle = 'rgba(29,36,51,.35)'; cx.lineWidth = 0.6;
  for (const f of flakes) {
    f.y += f.s * 38 * dt * big; f.x += Math.sin(now / 1400 + f.p) * 12 * dt;
    if (f.y > innerHeight + 5) { f.y = -5; f.x = Math.random() * innerWidth; }
    cx.beginPath(); cx.arc(f.x, f.y, f.r * big, 0, Math.PI * 2); cx.fill(); cx.stroke();
  }
  requestAnimationFrame(loop);
}

// ---------- 線が引かれていく導入 ----------
function intro() {
  const paths = [...svg.querySelectorAll('.ink path')];
  const v = view;
  paths.forEach(p => {
    const len = p.getTotalLength();
    if (!len || p.getAttribute('stroke') === 'none') return;
    const bb = p.getBBox();
    const delay = Math.max(0, (bb.x - v.x) / v.w) * 2.2 + Math.random() * 0.3;
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.style.transition = `stroke-dashoffset ${1.1 + Math.random() * 0.6}s ease-out ${delay}s`;
  });
  svg.querySelectorAll('.win .glass').forEach(g => g.setAttribute('fill-opacity', 0));
  windows.forEach(w => (w.sceneG.style.opacity = 0, w.sceneG.style.transition = 'opacity 1.2s'));
  requestAnimationFrame(() => requestAnimationFrame(() => paths.forEach(p => p.style.strokeDashoffset = 0)));
  setTimeout(() => {
    paths.forEach(p => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; p.style.transition = ''; });
    svg.classList.remove('intro');
    windows.filter(w => w.lit).forEach(w => paintWindow(w, Math.random() * 1800));
  }, 4300);
}

function resize() { aspect = innerWidth / innerHeight; resizeSnow(); if (zoomed) { const z = zoomed; zoomed = null; zoomTo(z); } else setView(homeView()); }
addEventListener('resize', resize);
pan = Math.max(0, 1320 - overview().w / 2 - 700);
resize();
updateFound();
intro();
requestAnimationFrame(loop);
</script>
