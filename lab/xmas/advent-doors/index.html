<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advent Doors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --fg: #f3ecdf; --dim: rgba(243,236,223,.55); --line: rgba(243,236,223,.18); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b1220; color: var(--fg); font-family: 'Outfit', sans-serif; min-height: 100vh;
         background-image: radial-gradient(circle at 20% 10%, rgba(255,210,140,.07), transparent 40%), radial-gradient(circle at 80% 90%, rgba(120,160,255,.06), transparent 45%); }
  .top { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 20px 0; }
  .top a { color: var(--dim); font-size: 12px; letter-spacing: .2em; text-decoration: none; }
  h1 { font-weight: 200; font-size: 15px; letter-spacing: .35em; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 64px; }
  .note { text-align: center; color: var(--dim); font-size: 12px; letter-spacing: .12em; line-height: 1.9; margin-bottom: 26px; }
  .board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; padding: 18px; border-radius: 14px;
           background: linear-gradient(160deg, #13213a, #0c1526); box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06); }
  @media (max-width: 640px) { .board { grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px; } }
  .cell { position: relative; aspect-ratio: 4 / 5; perspective: 1600px; border-radius: 6px; background: #04070d;
          box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), inset 0 8px 20px rgba(0,0,0,.9); }
  .cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px; display: block; }
  .door { position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d; cursor: pointer;
          transition: transform 1.1s cubic-bezier(.25,.8,.25,1); }
  .face, .back { position: absolute; inset: 0; border-radius: 6px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face { display: grid; place-items: center; background: var(--c);
          box-shadow: inset 0 0 0 5px var(--c), inset 0 0 0 6px rgba(255,255,255,.28), inset 0 -20px 30px rgba(0,0,0,.18); }
  .face b { font-family: 'Shippori Mincho', serif; font-weight: 500; font-size: clamp(20px, 4.4vw, 38px); color: var(--n); }
  .face i { position: absolute; right: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #d8b064; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .back { transform: rotateY(180deg); background: #cdbf9f; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .cell:hover .door { transform: rotateY(-14deg); }
  .cell.open { z-index: 2; }
  .cell.open .door { transform: rotateY(-104deg); }
  .cell.today .face { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: inset 0 0 0 5px var(--c), inset 0 0 0 6px rgba(255,230,160,.9), 0 0 24px rgba(255,210,120,.55); } }
  .foot { margin-top: 26px; text-align: center; }
  button { font: inherit; font-size: 12px; letter-spacing: .1em; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line);
           border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
</style>
</head>
<body>
<div class="top"><h1>ADVENT DOORS</h1><a href="../">← XMAS LAB</a></div>
<main>
  <p class="note" id="note"></p>
  <div class="board" id="board"></div>
  <div class="foot"><button id="bClose">ぜんぶ閉める</button></div>
</main>
<script>
const KEY = 'xmas-advent-v1';
const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (_) { return new Set(); } };
const save = s => { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch (_) {} };
const opened = load();

const now = new Date(), isDec = now.getMonth() === 11, today = isDec ? now.getDate() : 0;
document.getElementById('note').innerHTML = isDec && today <= 24
  ? `今日は ${today} 日。光っている扉からどうぞ。<br>試作なので、ほかの日もあけられます。`
  : '24 枚の扉の奥に、小さな冬の場面が入っています。<br>12月になると、その日の扉が光ります（試作なので今もあけられます）。';

// ── 扉の奥の場面（どれもその場で描いて動かす）──
const TAU = Math.PI * 2;
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
function sky(g, w, h, top, bot) { const s = g.createLinearGradient(0, 0, 0, h); s.addColorStop(0, top); s.addColorStop(1, bot); g.fillStyle = s; g.fillRect(0, 0, w, h); }
function stars(g, w, h, t, n, k = 1) { for (let i = 0; i < n; i++) { const a = 0.3 + 0.7 * Math.abs(Math.sin(t * (0.6 + hash(i + k) * 2) + i)); g.fillStyle = `rgba(255,255,240,${a})`; g.fillRect(hash(i * 3 + k) * w, hash(i * 7 + k) * h * 0.7, 1.4, 1.4); } }
function snow(g, w, h, t, n, k = 1) { g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < n; i++) { const sp = 0.05 + hash(i + k) * 0.08, y = ((hash(i * 5 + k) + t * sp) % 1) * h, x = hash(i * 9 + k) * w + Math.sin(t + i) * 4; g.beginPath(); g.arc(x, y, 0.8 + hash(i * 2) * 1.6, 0, TAU); g.fill(); } }
function glowAt(g, x, y, r, col) { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2); }
function hill(g, w, h, y, col = '#e8eef8') { g.fillStyle = col; g.beginPath(); g.moveTo(0, h); g.lineTo(0, y); g.quadraticCurveTo(w * 0.5, y - h * 0.12, w, y + h * 0.03); g.lineTo(w, h); g.fill(); }
function starShape(g, x, y, r1, r2, rot) { g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / 5 - Math.PI / 2; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); }

const SCENES = {
  snowfall(g, w, h, t, v) { sky(g, w, h, '#0d1a33', v.c2); stars(g, w, h, t, 18); hill(g, w, h, h * 0.78); snow(g, w, h, t, 40); },
  candle(g, w, h, t, v) {
    sky(g, w, h, '#0a0606', '#1a0f0a');
    const f = 1 + Math.sin(t * 13) * 0.06 + Math.sin(t * 7.3) * 0.05, cx = w / 2, top = h * 0.5;
    glowAt(g, cx, top - h * 0.08, w * 0.7 * f, 'rgba(255,170,80,.35)');
    g.fillStyle = v.c1; g.fillRect(cx - w * 0.12, top, w * 0.24, h * 0.4);
    g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(cx - w * 0.12, top, w * 0.05, h * 0.4);
    g.fillStyle = '#222'; g.fillRect(cx - 1, top - h * 0.03, 2, h * 0.03);
    g.save(); g.translate(cx + Math.sin(t * 3) * 1.5, top - h * 0.03); g.scale(1, f);
    const fl = g.createRadialGradient(0, -h * 0.05, 1, 0, -h * 0.05, h * 0.1); fl.addColorStop(0, '#fff8d0'); fl.addColorStop(0.5, '#ffb84a'); fl.addColorStop(1, 'rgba(255,90,20,0)');
    g.fillStyle = fl; g.beginPath(); g.ellipse(0, -h * 0.06, w * 0.06, h * 0.1, 0, 0, TAU); g.fill(); g.restore();
  },
  star(g, w, h, t, v) {
    sky(g, w, h, '#06091a', '#141a3a'); stars(g, w, h, t, 30, 5);
    const cx = w / 2, cy = h * 0.45, s = Math.min(w, h);
    g.save(); g.translate(cx, cy); g.rotate(t * 0.2);
    for (let i = 0; i < 12; i++) { g.rotate(TAU / 12); g.fillStyle = `rgba(255,230,160,${0.08 + 0.06 * Math.sin(t * 2 + i)})`; g.fillRect(-1, 0, 2, s * 0.6); }
    g.restore();
    glowAt(g, cx, cy, s * 0.4, 'rgba(255,220,140,.4)');
    g.fillStyle = v.c1; starShape(g, cx, cy, s * 0.2 * (1 + Math.sin(t * 2) * 0.05), s * 0.08, Math.sin(t) * 0.1); g.fill();
  },
  moon(g, w, h, t) {
    sky(g, w, h, '#0b1430', '#26304f'); stars(g, w, h, t, 26, 9);
    const cx = w * 0.62, cy = h * 0.35, r = Math.min(w, h) * 0.18;
    glowAt(g, cx, cy, r * 3, 'rgba(220,230,255,.25)');
    g.fillStyle = '#f4efd8'; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    g.fillStyle = '#152042'; g.beginPath(); g.arc(cx + r * 0.45, cy - r * 0.2, r * 0.9, 0, TAU); g.fill();
    for (let i = 0; i < 3; i++) { const x = ((t * (8 + i * 4) + i * 90) % (w + 120)) - 60, y = h * (0.5 + i * 0.13); g.fillStyle = `rgba(200,210,240,${0.12 + i * 0.05})`; g.beginPath(); g.ellipse(x, y, w * 0.25, h * 0.04, 0, 0, TAU); g.fill(); }
  },
  gift(g, w, h, t, v) {
    sky(g, w, h, '#1a0d12', '#2c1418');
    const cx = w / 2, by = h * 0.82, bw = w * 0.5, bh = h * 0.3, ph = (t % 2.4) / 2.4, jump = ph < 0.25 ? Math.sin(ph / 0.25 * Math.PI) : 0;
    glowAt(g, cx, by - bh, w * (0.3 + jump * 0.4), 'rgba(255,220,140,.4)');
    g.fillStyle = v.c1; g.fillRect(cx - bw / 2, by - bh, bw, bh);
    g.fillStyle = v.c2; g.fillRect(cx - w * 0.04, by - bh, w * 0.08, bh);
    g.save(); g.translate(cx, by - bh - jump * h * 0.12); g.rotate(-jump * 0.25);
    g.fillStyle = v.c1; g.fillRect(-bw * 0.56, -h * 0.07, bw * 1.12, h * 0.07);
    g.fillStyle = v.c2; g.fillRect(-w * 0.04, -h * 0.07, w * 0.08, h * 0.07);
    g.beginPath(); g.ellipse(-w * 0.07, -h * 0.1, w * 0.07, h * 0.035, -0.5, 0, TAU); g.ellipse(w * 0.07, -h * 0.1, w * 0.07, h * 0.035, 0.5, 0, TAU); g.fill();
    g.restore();
    if (jump > 0) for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + (i - 3.5) * 0.25, d = jump * h * 0.35; g.fillStyle = `rgba(255,230,150,${jump})`; g.beginPath(); g.arc(cx + Math.cos(a) * d, by - bh + Math.sin(a) * d, 1.6, 0, TAU); g.fill(); }
  },
  tree(g, w, h, t) {
    sky(g, w, h, '#071422', '#10263a'); stars(g, w, h, t, 12, 3); hill(g, w, h, h * 0.86);
    const cx = w / 2;
    g.fillStyle = '#5a3a22'; g.fillRect(cx - w * 0.04, h * 0.76, w * 0.08, h * 0.08);
    g.fillStyle = '#1f6b44';
    for (let i = 0; i < 3; i++) { const y = h * (0.28 + i * 0.17), s = w * (0.18 + i * 0.08); g.beginPath(); g.moveTo(cx, y - h * 0.13); g.lineTo(cx + s, y + h * 0.12); g.lineTo(cx - s, y + h * 0.12); g.fill(); }
    const cols = ['#ff5a6a', '#ffd25a', '#6ad0ff', '#ff8ae0'];
    for (let i = 0; i < 14; i++) { const yy = 0.25 + hash(i) * 0.55, s = (yy - 0.15) * 0.5, x = cx + (hash(i + 40) * 2 - 1) * w * s, y = h * yy + h * 0.03; const on = Math.sin(t * 3 + i * 1.7) > -0.2; if (on) glowAt(g, x, y, 7, cols[i % 4] + '88'); g.fillStyle = on ? cols[i % 4] : '#444'; g.beginPath(); g.arc(x, y, 1.8, 0, TAU); g.fill(); }
    glowAt(g, cx, h * 0.15, 16, 'rgba(255,220,120,.6)'); g.fillStyle = '#ffd86a'; starShape(g, cx, h * 0.15, 7, 3, 0); g.fill();
  },
  bell(g, w, h, t, v) {
    sky(g, w, h, '#1d0c10', '#33121a');
    const a = Math.sin(t * 3) * 0.45, cx = w / 2, cy = h * 0.18;
    g.save(); g.translate(cx, cy); g.rotate(a);
    g.strokeStyle = '#a33'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, h * 0.12); g.stroke();
    const bw = w * 0.22, bh = h * 0.3, y0 = h * 0.12;
    g.fillStyle = v.c1; g.beginPath(); g.moveTo(-bw * 0.5, y0 + bh * 0.2); g.quadraticCurveTo(-bw * 0.5, y0, 0, y0); g.quadraticCurveTo(bw * 0.5, y0, bw * 0.5, y0 + bh * 0.2);
    g.lineTo(bw, y0 + bh); g.lineTo(-bw, y0 + bh); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(-bw * 0.35, y0 + bh * 0.2, bw * 0.12, bh * 0.6);
    g.fillStyle = '#8a6a2a'; g.beginPath(); g.arc(Math.sin(t * 3 - 0.6) * bw * 0.3, y0 + bh * 1.05, w * 0.04, 0, TAU); g.fill();
    g.restore();
    const ring = Math.abs(Math.cos(t * 3)); if (ring > 0.92) { g.strokeStyle = 'rgba(255,220,150,.5)'; g.lineWidth = 1.5; for (const s of [-1, 1]) { g.beginPath(); g.arc(cx + s * w * 0.3, h * 0.55, w * 0.08, -0.7, 0.7); g.stroke(); } }
  },
  snowman(g, w, h, t) {
    sky(g, w, h, '#0e1d36', '#2a3d63'); hill(g, w, h, h * 0.84); snow(g, w, h, t, 26, 7);
    const cx = w / 2;
    g.fillStyle = '#f3f6fc';
    g.beginPath(); g.arc(cx, h * 0.72, w * 0.2, 0, TAU); g.arc(cx, h * 0.46, w * 0.14, 0, TAU); g.fill();
    const blink = (t % 3.5) < 0.12 ? 0.2 : 1;
    g.fillStyle = '#222'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * w * 0.05, h * 0.43, 1.8, 1.8 * blink, 0, 0, TAU); g.fill(); }
    g.fillStyle = '#f08a2c'; g.beginPath(); g.moveTo(cx, h * 0.46); g.lineTo(cx + w * 0.1, h * 0.475); g.lineTo(cx, h * 0.49); g.fill();
    g.fillStyle = '#c0283a'; g.fillRect(cx - w * 0.15, h * 0.53, w * 0.3, h * 0.04);
    g.fillStyle = '#222'; g.fillRect(cx - w * 0.12, h * 0.33, w * 0.24, h * 0.03); g.fillRect(cx - w * 0.08, h * 0.22, w * 0.16, h * 0.12);
  },
  shooting(g, w, h, t) {
    sky(g, w, h, '#040716', '#121a3a'); stars(g, w, h, t, 40, 11);
    for (let i = 0; i < 2; i++) {
      const p = ((t * 0.45 + i * 0.5) % 1.3); if (p > 1) continue;
      const x = w * (1.1 - p * 1.3) + i * w * 0.2, y = h * (0.1 + p * 0.55) - i * h * 0.1;
      const gr = g.createLinearGradient(x, y, x + w * 0.35, y - h * 0.18); gr.addColorStop(0, 'rgba(255,250,220,.95)'); gr.addColorStop(1, 'rgba(255,250,220,0)');
      g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w * 0.35, y - h * 0.18); g.stroke();
      glowAt(g, x, y, 8, 'rgba(255,255,230,.8)');
    }
  },
  mug(g, w, h, t, v) {
    sky(g, w, h, '#1b120c', '#2c1c12');
    const cx = w / 2, y = h * 0.55, mw = w * 0.4, mh = h * 0.32;
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2.2; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) { g.beginPath(); for (let k = 0; k <= 20; k++) { const p = k / 20, yy = y - 6 - p * h * 0.35, xx = cx + (i - 1) * w * 0.09 + Math.sin(p * 6 + t * 2 + i) * w * 0.04 * p; k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.globalAlpha = 0.6; g.stroke(); g.globalAlpha = 1; }
    g.fillStyle = v.c1; g.fillRect(cx - mw / 2, y, mw, mh);
    g.strokeStyle = v.c1; g.lineWidth = w * 0.05; g.beginPath(); g.arc(cx + mw / 2, y + mh * 0.45, mh * 0.25, -1.3, 1.3); g.stroke();
    g.fillStyle = '#5b3018'; g.beginPath(); g.ellipse(cx, y, mw / 2, h * 0.025, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(cx - mw * 0.2 + i * mw * 0.2, y - 1, 3, 0, TAU); g.fill(); }
  },
  ornament(g, w, h, t, v) {
    sky(g, w, h, '#0b1a14', '#14301f');
    const a = Math.sin(t * 1.6) * 0.3, len = h * 0.42;
    g.save(); g.translate(w / 2, 0); g.rotate(a);
    g.strokeStyle = '#d8b064'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, len); g.stroke();
    const r = Math.min(w, h) * 0.2;
    g.fillStyle = '#c9a24a'; g.fillRect(-r * 0.25, len - 2, r * 0.5, r * 0.3);
    const bg = g.createRadialGradient(-r * 0.35, len + r * 0.9, r * 0.1, 0, len + r * 1.2, r); bg.addColorStop(0, '#fff'); bg.addColorStop(0.15, v.c1); bg.addColorStop(1, v.c2);
    g.fillStyle = bg; g.beginPath(); g.arc(0, len + r * 1.2, r, 0, TAU); g.fill();
    g.restore();
  },
  aurora(g, w, h, t) {
    sky(g, w, h, '#020814', '#071a2a'); stars(g, w, h, t, 30, 13);
    g.globalCompositeOperation = 'lighter';
    for (let b = 0; b < 3; b++) {
      for (let x = 0; x < w; x += 2) {
        const y = h * (0.3 + b * 0.08) + Math.sin(x * 0.03 + t * (0.6 + b * 0.2) + b) * h * 0.06 + Math.sin(x * 0.011 - t * 0.4) * h * 0.05;
        const a = 0.12 + 0.1 * Math.sin(x * 0.05 + t * 2 + b);
        const gr = g.createLinearGradient(0, y - h * 0.18, 0, y); gr.addColorStop(0, 'rgba(120,80,255,0)'); gr.addColorStop(1, b === 1 ? `rgba(120,200,255,${a})` : `rgba(80,255,170,${a})`);
        g.fillStyle = gr; g.fillRect(x, y - h * 0.18, 2, h * 0.18);
      }
    }
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#04080e'; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += w / 10) g.lineTo(x, h * 0.85 - (Math.floor(x / (w / 10)) % 2) * h * 0.08); g.lineTo(w, h); g.fill();
  },
  sleigh(g, w, h, t) {
    sky(g, w, h, '#0a1230', '#3a3058'); stars(g, w, h, t, 20, 17);
    const mx = w * 0.5, my = h * 0.45, r = Math.min(w, h) * 0.3;
    glowAt(g, mx, my, r * 1.8, 'rgba(255,240,200,.25)'); g.fillStyle = '#f6eed6'; g.beginPath(); g.arc(mx, my, r, 0, TAU); g.fill();
    const p = (t * 0.12) % 1, x = w * (1.3 - p * 1.6), y = h * 0.5 + Math.sin(p * 9) * h * 0.04;
    g.fillStyle = '#0a0d1c';
    for (let i = 0; i < 2; i++) { const dx = x + i * w * 0.14; g.beginPath(); g.ellipse(dx, y, w * 0.05, h * 0.02, 0, 0, TAU); g.fill(); g.fillRect(dx - w * 0.04, y, 1.5, h * 0.04); g.fillRect(dx + w * 0.035, y, 1.5, h * 0.04); g.beginPath(); g.arc(dx - w * 0.055, y - h * 0.025, w * 0.015, 0, TAU); g.fill(); g.fillRect(dx - w * 0.065, y - h * 0.06, 1.2, h * 0.03); }
    const sx = x + w * 0.33; g.beginPath(); g.moveTo(sx - w * 0.07, y - h * 0.03); g.lineTo(sx + w * 0.07, y - h * 0.03); g.lineTo(sx + w * 0.09, y + h * 0.04); g.lineTo(sx - w * 0.07, y + h * 0.04); g.fill();
    g.fillRect(sx - w * 0.09, y + h * 0.05, w * 0.2, 1.5);
    g.strokeStyle = '#0a0d1c'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + w * 0.16, y); g.lineTo(sx - w * 0.07, y); g.stroke();
  },
  house(g, w, h, t) {
    sky(g, w, h, '#0a1426', '#1a2a46'); stars(g, w, h, t, 16, 21); hill(g, w, h, h * 0.8); snow(g, w, h, t, 20, 23);
    const cx = w / 2, by = h * 0.8, hw = w * 0.42, hh = h * 0.22;
    g.fillStyle = '#3a2a2a'; g.fillRect(cx - hw / 2, by - hh, hw, hh);
    g.fillStyle = '#f2f5fb'; g.beginPath(); g.moveTo(cx - hw * 0.62, by - hh); g.lineTo(cx, by - hh - h * 0.17); g.lineTo(cx + hw * 0.62, by - hh); g.fill();
    g.fillStyle = '#3a2a2a'; g.fillRect(cx + hw * 0.18, by - hh - h * 0.14, w * 0.06, h * 0.08);
    const fl = 0.8 + 0.2 * Math.sin(t * 5);
    glowAt(g, cx - hw * 0.22, by - hh * 0.55, w * 0.18, `rgba(255,180,80,${0.4 * fl})`);
    g.fillStyle = `rgba(255,205,120,${fl})`; g.fillRect(cx - hw * 0.32, by - hh * 0.7, hw * 0.2, hh * 0.3);
    g.fillStyle = '#1c1210'; g.fillRect(cx + hw * 0.1, by - hh * 0.6, hw * 0.16, hh * 0.6);
    for (let i = 0; i < 5; i++) { const p = ((t * 0.25 + i / 5) % 1); g.fillStyle = `rgba(200,200,210,${0.35 * (1 - p)})`; g.beginPath(); g.arc(cx + hw * 0.21 + Math.sin(p * 5 + t) * 5 + p * 10, by - hh - h * 0.15 - p * h * 0.3, 3 + p * 8, 0, TAU); g.fill(); }
  },
  candy(g, w, h, t) {
    sky(g, w, h, '#1d0f17', '#2c1622');
    const cx = w / 2, lw = w * 0.13;
    g.save(); g.lineCap = 'round'; g.lineWidth = lw;
    const path = () => { g.beginPath(); g.moveTo(cx + w * 0.02, h * 0.85); g.lineTo(cx + w * 0.02, h * 0.35); g.arc(cx - w * 0.1, h * 0.35, w * 0.12, 0, Math.PI, true); };
    g.strokeStyle = '#fff6ee'; path(); g.stroke();
    g.strokeStyle = '#d42b3a'; g.lineWidth = lw * 0.9; g.setLineDash([lw * 0.55, lw * 0.6]); g.lineDashOffset = -t * 18; path(); g.stroke();
    g.restore();
    glowAt(g, cx, h * 0.5, w * 0.6, 'rgba(255,150,170,.12)');
  },
  flake(g, w, h, t, v) {
    sky(g, w, h, '#071526', '#0f2a44'); snow(g, w, h, t, 18, 29);
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.3;
    g.save(); g.translate(cx, cy); g.rotate(t * 0.3); g.strokeStyle = v.c1; g.lineWidth = 2; g.lineCap = 'round';
    glowAt(g, 0, 0, r * 1.4, 'rgba(160,210,255,.25)');
    for (let i = 0; i < 6; i++) {
      g.rotate(TAU / 6); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -r); g.stroke();
      for (const k of [0.4, 0.68]) { g.beginPath(); g.moveTo(0, -r * k); g.lineTo(-r * 0.2, -r * (k + 0.17)); g.moveTo(0, -r * k); g.lineTo(r * 0.2, -r * (k + 0.17)); g.stroke(); }
    }
    g.restore();
  },
  finale(g, w, h, t) {
    sky(g, w, h, '#0a1024', '#2a1830'); stars(g, w, h, t, 40, 31); snow(g, w, h, t, 30, 37);
    SCENES.tree(g, w, h, t);
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 20; i++) { const a = i / 20 * TAU + t * 0.5, rr = Math.min(w, h) * (0.3 + 0.08 * Math.sin(t * 2 + i)); glowAt(g, w / 2 + Math.cos(a) * rr, h * 0.5 + Math.sin(a) * rr * 0.8, 6, 'rgba(255,220,140,.7)'); }
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#fff3d6'; g.font = `500 ${Math.round(w * 0.1)}px 'Shippori Mincho', serif`; g.textAlign = 'center';
    g.fillText('Merry Christmas', w / 2, h * 0.95);
  },
};

const DOOR_COLS = [['#7d1f2c', '#f3e3c3'], ['#1f4d36', '#f3e3c3'], ['#e8dcc4', '#7d1f2c'], ['#22355e', '#f0d38a'], ['#b08a3a', '#2a1a10']];
const ORDER = ['snowfall', 'candle', 'star', 'moon', 'gift', 'tree', 'bell', 'snowman', 'shooting', 'mug', 'ornament', 'aurora',
               'sleigh', 'house', 'candy', 'flake', 'gift', 'candle', 'ornament', 'snowfall', 'bell', 'mug', 'star', 'finale'];
const VARIANTS = [{ c1: '#e6dcc8', c2: '#2a3a60' }, { c1: '#c42a3a', c2: '#ffe08a' }, { c1: '#2d8a5a', c2: '#d8b064' }, { c1: '#4a7ad8', c2: '#0d1a40' }, { c1: '#ffd86a', c2: '#a33' }];

// 番号の並びは毎回同じ（ランダムに見えるが固定）
const days = Array.from({ length: 24 }, (_, i) => i + 1);
for (let i = days.length - 1; i > 0; i--) { const j = Math.floor(hash(i * 13.7) * (i + 1)); [days[i], days[j]] = [days[j], days[i]]; }

const board = document.getElementById('board'), cells = [];
days.forEach((d, k) => {
  const [c, n] = DOOR_COLS[(k * 3 + d) % DOOR_COLS.length];
  const el = document.createElement('div');
  el.className = 'cell' + (opened.has(d) ? ' open' : '') + (d === today ? ' today' : '');
  el.innerHTML = `<canvas></canvas><div class="door" role="button" aria-label="${d}日の扉"><div class="face" style="--c:${c};--n:${n}"><b>${d}</b><i></i></div><div class="back"></div></div>`;
  board.appendChild(el);
  const cell = { d, el, cv: el.querySelector('canvas'), scene: SCENES[ORDER[d - 1]], v: VARIANTS[d % VARIANTS.length], seen: false };
  cells.push(cell);
  el.querySelector('.door').addEventListener('click', () => {
    const open = el.classList.toggle('open');
    open ? opened.add(d) : opened.delete(d);
    save(opened);
    if (open) { sizeCanvas(cell); chime(d); }
  });
});

function sizeCanvas(c) {
  const r = c.el.getBoundingClientRect(), D = Math.min(devicePixelRatio, 2);
  c.w = r.width; c.h = r.height; c.cv.width = r.width * D; c.cv.height = r.height * D;
  c.g = c.cv.getContext('2d'); c.g.setTransform(D, 0, 0, D, 0, 0);
}
cells.forEach(sizeCanvas);
addEventListener('resize', () => cells.forEach(sizeCanvas));
const io = new IntersectionObserver(es => es.forEach(e => { const c = cells.find(c => c.el === e.target); if (c) c.seen = e.isIntersecting; }));
cells.forEach(c => io.observe(c.el));

document.getElementById('bClose').onclick = () => { cells.forEach(c => c.el.classList.remove('open')); opened.clear(); save(opened); };

// 扉をあけると、日ごとに少しずつ高くなる鈴の音
let ac = null;
function chime(d) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const scale = [0, 2, 4, 7, 9], m = 72 + scale[d % 5] + 12 * Math.floor(d / 10), f = 440 * Math.pow(2, (m - 69) / 12), t = ac.currentTime;
    const car = ac.createOscillator(), mod = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
    car.frequency.value = f; mod.frequency.value = f * 3.5; mg.gain.setValueAtTime(f * 1.2, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.2);
    mod.connect(mg).connect(car.frequency); car.connect(g).connect(ac.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2);
    car.start(t); mod.start(t); car.stop(t + 2.1); mod.stop(t + 2.1);
  } catch (_) {}
}

(function loop(ms) {
  const t = ms / 1000;
  for (const c of cells) if (c.seen && c.el.classList.contains('open')) { c.g.clearRect(0, 0, c.w, c.h); c.scene(c.g, c.w, c.h, t + c.d * 3, c.v); }
  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
