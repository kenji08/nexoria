<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chime Tree</title>
<meta name="description" content="オーナメントを撫でると揺れて鳴る、楽器のツリー。弾いた順番が光の線で残り、あとから再生できる。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #07110f; color: #e9f3ea; font-family: 'Outfit', sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .head { position: fixed; top: 24px; left: 24px; pointer-events: none; }
  .head h1 { font-weight: 200; font-size: clamp(22px, 4vw, 32px); letter-spacing: .32em; }
  .head p { margin-top: 8px; font-size: 13px; font-weight: 300; opacity: .55; letter-spacing: .06em; }
  .back { position: fixed; top: 24px; right: 24px; color: #e9f3ea; opacity: .55; text-decoration: none; font-size: 13px; letter-spacing: .1em; }
  .bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; flex-wrap: wrap; justify-content: center;
         border-radius: 999px; background: rgba(20,40,34,.55); border: 1px solid rgba(233,243,234,.14); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: calc(100vw - 32px); }
  .bar button { font: inherit; font-size: 13px; letter-spacing: .06em; color: #e9f3ea; background: none; border: 1px solid transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .bar button:hover { border-color: rgba(233,243,234,.25); }
  .bar button:disabled { opacity: .35; cursor: default; }
  .notes { font-size: 12px; opacity: .5; padding: 8px 10px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="head">
  <h1>CHIME TREE</h1>
  <p>オーナメントを撫でると鳴る ・ てっぺんの星でぜんぶ鳴らす</p>
</div>
<a class="back" href="../">← index</a>
<div class="bar">
  <button id="play" disabled>▶ いまの演奏を再生</button>
  <button id="clear" disabled>消す</button>
  <span class="notes" id="notes">0 音</span>
</div>

<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, DPR;

// ---------- 音（FMベル＋簡易リバーブ） ----------
let actx = null, out = null;
function audio() {
  if (actx) return actx;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  out = actx.createGain(); out.gain.value = 0.9;
  const rev = actx.createConvolver(), len = actx.sampleRate * 2.6, buf = actx.createBuffer(2, len, actx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  rev.buffer = buf;
  const wet = actx.createGain(); wet.gain.value = 0.35;
  out.connect(actx.destination); out.connect(rev).connect(wet).connect(actx.destination);
  return actx;
}
function bell(freq, vel = 1) {
  const a = audio(), t = a.currentTime;
  const car = a.createOscillator(), mod = a.createOscillator(), mg = a.createGain(), g = a.createGain();
  car.frequency.value = freq; mod.frequency.value = freq * 3.5;
  mg.gain.setValueAtTime(freq * 2.2 * vel, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.2);
  mod.connect(mg).connect(car.frequency);
  const v = 0.08 * Math.min(1, 0.4 + vel * 0.6) * (440 / freq) ** 0.3;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
  const pan = a.createStereoPanner ? a.createStereoPanner() : null;
  car.connect(g); if (pan) { pan.pan.value = (Math.random() - 0.5) * 0.6; g.connect(pan).connect(out); } else g.connect(out);
  car.start(t); mod.start(t); car.stop(t + 3); mod.stop(t + 3);
}

// ---------- ツリーとオーナメント ----------
const SCALE = [0, 2, 4, 7, 9]; // ペンタトニック
const noteFreq = n => 293.66 * Math.pow(2, (Math.floor(n / 5) * 12 + SCALE[((n % 5) + 5) % 5]) / 12);
const COLORS = ['#e2574c', '#f2c14e', '#6fb7e8', '#f4f1e8', '#b98be0', '#e98aa8'];
let orns = [], tree = null;

function layout() {
  const top = H * 0.15, base = Math.min(H * 0.78, H - 160), half = Math.min(W * 0.42, (base - top) * 0.55);
  tree = { cx: W / 2, top, base, half };
  orns = [];
  const rows = 7;
  let idx = 0;
  for (let r = 0; r < rows; r++) {
    const t = (r + 0.8) / (rows + 0.2), y = top + (base - top) * t, w = half * t * 0.92;
    const count = 2 + r;
    for (let k = 0; k < count; k++) {
      const u = count === 1 ? 0 : k / (count - 1) * 2 - 1;
      const x = tree.cx + u * w * 0.88 + (r % 2 ? 6 : -6);
      const L = 16 + ((k * 7 + r * 3) % 4) * 7, rad = Math.max(8, Math.min(W, H) * 0.017) * (1.25 - r * 0.04);
      // 上ほど高い音
      const note = (rows - 1 - r) * 2 + (k % 3) + 3;
      orns.push({ ax: x, ay: y - 8, L, r: rad, th: 0, om: 0, col: COLORS[idx % COLORS.length], note, glow: 0, cool: 0, id: idx });
      idx++;
    }
  }
}

// ---------- 入力 ----------
let pointer = null, record = [], recStart = 0, trail = [], playing = null, sparks = [], rings = [];
function strike(o, vel, fromPlayback = false) {
  if (o.cool > 0) return;
  o.cool = 0.12; o.glow = 1; bell(noteFreq(o.note), vel);
  const p = ballPos(o);
  rings.push({ x: p.x, y: p.y, r: o.r, a: 0.8, col: o.col });
  for (let i = 0; i < 8; i++) sparks.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 60, vy: -Math.random() * 90 - 20, life: 1.2 + Math.random(), col: o.col });
  trail.push({ x: p.x, y: p.y, t: performance.now(), col: o.col });
  if (!fromPlayback) {
    const now = performance.now();
    if (!record.length || now - record[record.length - 1].t > 6000) { record = []; recStart = now; }
    record.push({ id: o.id, t: now, vel });
    if (record.length > 200) record.shift();
    updateUI();
  }
}
function ballPos(o) { return { x: o.ax + Math.sin(o.th) * o.L, y: o.ay + Math.cos(o.th) * o.L }; }

cv.addEventListener('pointerdown', e => {
  audio(); if (actx.state === 'suspended') actx.resume();
  pointer = { x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, down: true };
  // 星
  if (Math.hypot(e.clientX - tree.cx, e.clientY - (tree.top - 6)) < 34) { glissando(); return; }
  for (const o of orns) { const p = ballPos(o); if (Math.hypot(p.x - e.clientX, p.y - e.clientY) < o.r + 8) { o.om += (Math.random() - 0.5) * 6; strike(o, 1); } }
});
cv.addEventListener('pointermove', e => {
  const prev = pointer ? { x: pointer.x, y: pointer.y } : { x: e.clientX, y: e.clientY };
  pointer = { ...(pointer || {}), x: e.clientX, y: e.clientY, px: prev.x, py: prev.y };
  const vx = e.clientX - prev.x, vy = e.clientY - prev.y, speed = Math.hypot(vx, vy);
  if (speed < 0.5) return;
  for (const o of orns) {
    const p = ballPos(o);
    // 線分（前の位置→今の位置）とボールの距離
    const lx = e.clientX - prev.x, ly = e.clientY - prev.y, ll = lx * lx + ly * ly || 1;
    const t = Math.max(0, Math.min(1, ((p.x - prev.x) * lx + (p.y - prev.y) * ly) / ll));
    const d = Math.hypot(prev.x + lx * t - p.x, prev.y + ly * t - p.y);
    if (d < o.r + 6) {
      o.om += vx * 0.08;
      strike(o, Math.min(1, speed / 25));
    }
  }
  cv.style.cursor = Math.hypot(e.clientX - tree.cx, e.clientY - (tree.top - 6)) < 34 ? 'pointer' : 'crosshair';
});
cv.addEventListener('pointerleave', () => { pointer = null; });

function glissando() {
  const sorted = [...orns].sort((a, b) => a.ay - b.ay || a.ax - b.ax);
  sorted.forEach((o, i) => setTimeout(() => { o.om += 2.2; strike(o, 0.7); }, i * 55));
  starGlow = 1;
}
let starGlow = 0;

document.getElementById('play').onclick = () => {
  if (!record.length || playing) return;
  const t0 = record[0].t;
  playing = record.map(r => setTimeout(() => { const o = orns[r.id]; if (o) { o.om += 1.5; strike(o, r.vel, true); } }, r.t - t0));
  setTimeout(() => { playing = null; updateUI(); }, record[record.length - 1].t - t0 + 400);
  updateUI();
};
document.getElementById('clear').onclick = () => { record = []; trail = []; updateUI(); };
function updateUI() {
  document.getElementById('notes').textContent = `${record.length} 音`;
  document.getElementById('play').disabled = !record.length || !!playing;
  document.getElementById('clear').disabled = !record.length;
}

// ---------- 背景の雪 ----------
let snow = [];
function resize() {
  DPR = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  snow = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4, v: Math.random() * 20 + 10, p: Math.random() * 10 }));
}

// ---------- 描画 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; const t = now / 1000;
  const bg = cx.createRadialGradient(W / 2, H * 0.55, 10, W / 2, H * 0.55, Math.max(W, H) * 0.8);
  bg.addColorStop(0, '#12241f'); bg.addColorStop(1, '#050b0a');
  cx.fillStyle = bg; cx.fillRect(0, 0, W, H);

  cx.fillStyle = 'rgba(233,243,234,.55)';
  for (const s of snow) { s.y += s.v * dt; if (s.y > H) { s.y = -4; s.x = Math.random() * W; } cx.beginPath(); cx.arc(s.x + Math.sin(t * 0.6 + s.p) * 8, s.y, s.r, 0, Math.PI * 2); cx.fill(); }

  // 木（線で）
  const { cx: tx, top, base, half } = tree;
  cx.save(); cx.strokeStyle = 'rgba(160,215,180,.55)'; cx.lineWidth = 1.4; cx.lineJoin = 'round';
  const tiers = 5; cx.beginPath();
  for (let k = 0; k < tiers; k++) {
    const y0 = top + (base - top) * (k / tiers) * 0.95, y1 = top + (base - top) * ((k + 1) / tiers);
    const w1 = half * ((k + 1) / tiers);
    cx.moveTo(tx - w1 * 0.55 * (k ? 1 : 0), y0); cx.lineTo(tx - w1, y1); cx.quadraticCurveTo(tx, y1 + 16, tx + w1, y1); cx.lineTo(tx + w1 * 0.55 * (k ? 1 : 0), y0);
  }
  cx.moveTo(tx - 12, base + 6); cx.lineTo(tx - 12, base + 36); cx.lineTo(tx + 12, base + 36); cx.lineTo(tx + 12, base + 6);
  cx.stroke();
  // ガーランド（電球）
  for (let k = 1; k <= 4; k++) {
    const y = top + (base - top) * (k / 4.6), w = half * (k / 4.6);
    for (let i = 0; i <= 12; i++) {
      const u = i / 12, x = tx - w + u * w * 2, yy = y + Math.sin(u * Math.PI) * 14 + 6;
      const on = 0.4 + 0.6 * Math.max(0, Math.sin(t * 2 + i * 0.9 + k));
      cx.fillStyle = `rgba(255,214,140,${0.25 + on * 0.6})`; cx.beginPath(); cx.arc(x, yy, 2.2, 0, Math.PI * 2); cx.fill();
    }
  }
  cx.restore();

  // 星
  starGlow = Math.max(0, starGlow - dt * 0.6);
  cx.save(); cx.translate(tx, top - 6); cx.rotate(Math.sin(t * 0.7) * 0.08);
  cx.shadowColor = '#ffd27a'; cx.shadowBlur = 18 + starGlow * 40; cx.fillStyle = '#ffd27a';
  cx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = (k % 2 ? 9 : 22) * (1 + starGlow * 0.25); cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } cx.closePath(); cx.fill();
  cx.restore();

  // 光の軌跡（弾いた順）
  const life = 4500;
  trail = trail.filter(p => now - p.t < life);
  if (trail.length > 1) {
    cx.save(); cx.lineCap = 'round'; cx.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      if (b.t - a.t > 1500) continue;
      const k = 1 - (now - b.t) / life;
      cx.strokeStyle = `rgba(255,230,180,${k * 0.6})`; cx.lineWidth = 1 + k * 2.5; cx.shadowColor = 'rgba(255,200,120,.9)'; cx.shadowBlur = 10;
      cx.beginPath(); cx.moveTo(a.x, a.y); cx.quadraticCurveTo((a.x + b.x) / 2, Math.min(a.y, b.y) - 30, b.x, b.y); cx.stroke();
    }
    cx.restore();
  }

  // オーナメント（振り子）
  for (const o of orns) {
    o.om += -(900 / o.L) * Math.sin(o.th) * dt;
    o.om *= Math.pow(0.45, dt);
    o.th = Math.max(-1.2, Math.min(1.2, o.th + o.om * dt));
    o.cool -= dt; o.glow = Math.max(0, o.glow - dt * 1.4);
    const p = ballPos(o);
    cx.strokeStyle = 'rgba(233,243,234,.35)'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(o.ax, o.ay); cx.lineTo(p.x, p.y); cx.stroke();
    cx.save();
    cx.shadowColor = o.col; cx.shadowBlur = 6 + o.glow * 30;
    const grd = cx.createRadialGradient(p.x - o.r * 0.35, p.y - o.r * 0.35, 1, p.x, p.y, o.r);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.25 - o.glow * 0.1, o.col); grd.addColorStop(1, shade(o.col, 0.45 + o.glow * 0.4));
    cx.fillStyle = grd; cx.beginPath(); cx.arc(p.x, p.y, o.r * (1 + o.glow * 0.12), 0, Math.PI * 2); cx.fill();
    cx.restore();
    cx.fillStyle = 'rgba(220,200,150,.9)'; cx.fillRect(p.x - 2.5, p.y - o.r - 3, 5, 4);
  }

  // 波紋と火の粉
  rings = rings.filter(r => (r.r += dt * 70, r.a -= dt * 0.9) > 0);
  for (const r of rings) { cx.strokeStyle = hexA(r.col, r.a); cx.lineWidth = 1.2; cx.beginPath(); cx.arc(r.x, r.y, r.r, 0, Math.PI * 2); cx.stroke(); }
  sparks = sparks.filter(s => (s.life -= dt) > 0);
  for (const s of sparks) { s.vy += 30 * dt; s.x += s.vx * dt; s.y += s.vy * dt; cx.fillStyle = hexA(s.col, Math.min(1, s.life)); cx.beginPath(); cx.arc(s.x, s.y, 1.6, 0, Math.PI * 2); cx.fill(); }

  requestAnimationFrame(frame);
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${(n >> 16) * k | 0},${(n >> 8 & 255) * k | 0},${(n & 255) * k | 0})`; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${Math.max(0, a)})`; }

addEventListener('resize', resize);
resize(); updateUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
