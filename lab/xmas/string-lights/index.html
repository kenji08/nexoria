<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Lights</title>
<meta name="description" content="ドラッグした線がそのまま電飾になって、重さで垂れる。つまむと揺れ、光り方と色を切り替えられる。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="XMAS LAB">
<meta property="og:url" content="https://nexoria.lomo.jp/lab/xmas/string-lights/">
<meta property="og:title" content="STRING LIGHTS — XMAS LAB">
<meta property="og:description" content="ドラッグした線がそのまま電飾になって、重さで垂れる。つまむと揺れ、光り方と色を切り替えられる。">
<meta property="og:image" content="https://nexoria.lomo.jp/lab/xmas/og/string-lights.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script src="../share.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root { --fg: #eef2ff; --dim: rgba(238,242,255,.55); --line: rgba(238,242,255,.18); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #06070d; color: var(--fg); font-family: 'Outfit', sans-serif;
               touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .top { position: fixed; top: 18px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: baseline; pointer-events: none; }
  .top a { pointer-events: auto; color: var(--dim); font-size: 12px; letter-spacing: .2em; text-decoration: none; }
  h1 { font-weight: 200; font-size: 15px; letter-spacing: .35em; }
  .hint { position: fixed; left: 0; right: 0; bottom: 84px; text-align: center; font-size: 12px; letter-spacing: .14em; color: var(--dim); pointer-events: none; transition: opacity .8s; }
  .bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: calc(100% - 32px); }
  button { font: inherit; font-size: 12px; letter-spacing: .1em; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line);
           border-radius: 999px; padding: 9px 16px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  button:hover { background: rgba(255,255,255,.12); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>STRING LIGHTS</h1><a href="../">← XMAS LAB</a></div>
<div class="hint" id="hint">ドラッグして電飾を張る ・ 線をつまむと揺れる ・ 端をつまむと付け替え</div>
<div class="bar">
  <button id="bPal">色: カラフル</button>
  <button id="bMode">光り方: ゆらぎ</button>
  <button id="bUndo">ひとつ戻す</button>
  <button id="bClear">全部はずす</button>
</div>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, D;
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');

function resize() {
  D = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  cv.width = W * D; cv.height = H * D;
  bg.width = W * D; bg.height = H * D;
  bgx.setTransform(D, 0, 0, D, 0, 0);
  // 夜の壁と、遠くのぼけた灯り
  const g = bgx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1122'); g.addColorStop(1, '#05060b');
  bgx.fillStyle = g; bgx.fillRect(0, 0, W, H);
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) {
    const x = rnd() * W, y = H * (0.45 + rnd() * 0.55), r = 20 + rnd() * 60;
    const c = ['255,190,120', '160,190,255', '255,140,150'][i % 3];
    const rg = bgx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${c},${0.05 + rnd() * 0.05})`); rg.addColorStop(1, `rgba(${c},0)`);
    bgx.fillStyle = rg; bgx.beginPath(); bgx.arc(x, y, r, 0, Math.PI * 2); bgx.fill();
  }
}
addEventListener('resize', resize); resize();

const SEG = 11, GRAV = 1500, SLACK = 1.07;
const PALETTES = [
  { name: 'カラフル', cols: ['#ff4d5e', '#ffcf4d', '#4dff8a', '#4db8ff', '#ff7de0'] },
  { name: 'ウォーム', cols: ['#ffd29a'] },
  { name: '赤と緑', cols: ['#ff3b4a', '#3bff7a'] },
  { name: 'つめたい青', cols: ['#8fd3ff', '#ffffff', '#5a8cff'] },
  { name: '金', cols: ['#ffcf6b', '#fff1c4'] },
];
const MODES = ['ゆらぎ', '流れる', 'またたき', '呼吸'];
let pal = 0, mode = 0;

// 光のにじみはスプライトを色ごとに作っておく
const glowCache = {};
function glow(col) {
  if (glowCache[col]) return glowCache[col];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, col + 'ff'); rg.addColorStop(0.12, col + 'aa'); rg.addColorStop(0.4, col + '33'); rg.addColorStop(1, col + '00');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  return glowCache[col] = c;
}

const strands = [];
let grab = null, drawing = null, pointer = { x: 0, y: 0 };

function makeStrand(path) {
  const pts = path.map(p => ({ x: p.x, y: p.y, px: p.x, py: p.y, pin: false }));
  pts[0].pin = pts[pts.length - 1].pin = true;
  const bulbs = [];
  for (let i = 2; i < pts.length - 1; i += 3) bulbs.push({ i, rate: 1.5 + Math.random() * 3, ph: Math.random() * 7 });
  return { pts, rest: SEG * SLACK, bulbs, off: Math.floor(Math.random() * 5), pal };
}

// 最初から3本だけ張っておく
function demo() {
  const lines = [[0.04, 0.17, 0.96, 0.15], [0.1, 0.36, 0.7, 0.3], [0.4, 0.5, 0.94, 0.55]];
  lines.forEach(([x0, y0, x1, y1], k) => {
    const a = { x: x0 * W, y: y0 * H }, b = { x: x1 * W, y: y1 * H }, n = Math.max(4, Math.round(Math.hypot(b.x - a.x, b.y - a.y) / SEG));
    const path = Array.from({ length: n + 1 }, (_, i) => ({ x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n }));
    const s = makeStrand(path); s.pal = [0, 1, 0][k]; strands.push(s);
  });
}
demo();

function local(e) { return { x: e.clientX, y: e.clientY }; }
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const p = local(e); pointer = p;
  document.getElementById('hint').style.opacity = 0;
  // 近くの点をつまむ。なければ新しく引き始める
  let best = null, bd = 26;
  for (const s of strands) for (const q of s.pts) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = q; } }
  if (best) { grab = best; return; }
  drawing = { path: [p] };
});
cv.addEventListener('pointermove', e => {
  const p = local(e); pointer = p;
  if (drawing) {
    const path = drawing.path; let last = path[path.length - 1];
    let d = Math.hypot(p.x - last.x, p.y - last.y);
    while (d >= SEG) {
      last = { x: last.x + (p.x - last.x) * SEG / d, y: last.y + (p.y - last.y) * SEG / d };
      path.push(last); d -= SEG;
    }
  }
});
function up() {
  if (drawing && drawing.path.length >= 5) { strands.push(makeStrand(drawing.path)); plink(); }
  drawing = null; grab = null;
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

document.getElementById('bPal').onclick = e => { pal = (pal + 1) % PALETTES.length; strands.forEach(s => s.pal = pal); e.target.textContent = '色: ' + PALETTES[pal].name; };
document.getElementById('bMode').onclick = e => { mode = (mode + 1) % MODES.length; e.target.textContent = '光り方: ' + MODES[mode]; };
document.getElementById('bUndo').onclick = () => strands.pop();
document.getElementById('bClear').onclick = () => strands.length = 0;

// 張った瞬間に小さく鳴らす
let ac = null;
function plink() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = [1047, 1175, 1319, 1568, 1760][Math.floor(Math.random() * 5)];
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.3);
  } catch (_) {}
}

function step(dt, t) {
  for (const s of strands) {
    for (const p of s.pts) {
      if (p.pin || p === grab) continue;
      const vx = (p.x - p.px) * 0.993, vy = (p.y - p.py) * 0.993;
      p.px = p.x; p.py = p.y;
      const wind = Math.sin(t * 0.8 + p.x * 0.006) * 18 + Math.sin(t * 2.3 + p.y * 0.02) * 6;
      p.x += vx + wind * dt * dt; p.y += vy + GRAV * dt * dt;
      if (p.y > H - 4) p.y = H - 4;
    }
    if (grab && s.pts.includes(grab)) {
      grab.px = grab.x; grab.py = grab.y; grab.x = pointer.x; grab.y = pointer.y;
      if (grab.pin) { grab.px = grab.x; grab.py = grab.y; }
    }
    for (let k = 0; k < 14; k++) {
      for (let i = 0; i < s.pts.length - 1; i++) {
        const a = s.pts[i], b = s.pts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-4;
        const fa = (a.pin || a === grab) ? 0 : 1, fb = (b.pin || b === grab) ? 0 : 1, tot = fa + fb;
        if (!tot) continue;
        const m = (d - s.rest) / d;
        a.x += dx * m * fa / tot; a.y += dy * m * fa / tot;
        b.x -= dx * m * fb / tot; b.y -= dy * m * fb / tot;
      }
    }
  }
}

function level(b, idx, t) {
  switch (mode) {
    case 0: return 0.82 + 0.18 * Math.sin(t * 2 + idx * 1.7);
    case 1: return 0.12 + 0.88 * Math.pow(0.5 + 0.5 * Math.cos(idx * 1.5708 - t * 5), 4);
    case 2: { const v = 0.5 + 0.5 * Math.sin(t * b.rate + b.ph); return 0.1 + 0.9 * v * v * v; }
    default: return 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 1.4 - idx * 0.18));
  }
}

function drawWire(pts) {
  cx.beginPath(); cx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
    cx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const l = pts[pts.length - 1]; cx.lineTo(l.x, l.y);
  cx.strokeStyle = '#1c2a22'; cx.lineWidth = 2.2; cx.stroke();
  cx.strokeStyle = 'rgba(160,190,170,.12)'; cx.lineWidth = 0.8; cx.stroke();
}

function drawStrand(s, t) {
  const pts = s.pts, cols = PALETTES[s.pal].cols;
  drawWire(pts);
  // 留め具
  for (const p of [pts[0], pts[pts.length - 1]]) { cx.fillStyle = '#2b3330'; cx.beginPath(); cx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); cx.fill(); }
  const lit = [];
  s.bulbs.forEach((b, k) => {
    const p = pts[b.i], a = pts[b.i - 1], c = pts[b.i + 1];
    if (!a || !c) return;
    let nx = -(c.y - a.y), ny = c.x - a.x; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    if (ny < 0) { nx = -nx; ny = -ny; }                      // 電球は下を向いて垂れる
    const ang = Math.atan2(ny, nx) - Math.PI / 2 + Math.sin(t * 1.3 + k) * 0.08;
    const col = cols[(k + s.off) % cols.length], v = level(b, k, t);
    lit.push({ x: p.x + nx * 9, y: p.y + ny * 9, col, v });
    cx.save(); cx.translate(p.x, p.y); cx.rotate(ang);
    cx.fillStyle = '#1e2622'; cx.fillRect(-2.6, 0, 5.2, 5);
    cx.globalAlpha = 0.35 + 0.65 * v; cx.fillStyle = col;
    cx.beginPath(); cx.ellipse(0, 10, 3.6, 6.4, 0, 0, Math.PI * 2); cx.fill();
    cx.globalAlpha = 0.6 * v; cx.fillStyle = '#fff';
    cx.beginPath(); cx.ellipse(-1, 8.5, 1.1, 2.6, 0, 0, Math.PI * 2); cx.fill();
    cx.restore();
  });
  return lit;
}

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  const t = now / 1000, h = 1 / 120;
  while (acc >= h) { step(h, t); acc -= h; }
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.drawImage(bg, 0, 0);
  cx.setTransform(D, 0, 0, D, 0, 0);
  const lit = [];
  for (const s of strands) lit.push(...drawStrand(s, t));
  if (drawing) {
    cx.setLineDash([3, 6]); cx.strokeStyle = 'rgba(238,242,255,.35)'; cx.lineWidth = 1.2;
    cx.beginPath(); drawing.path.forEach((p, i) => i ? cx.lineTo(p.x, p.y) : cx.moveTo(p.x, p.y)); cx.lineTo(pointer.x, pointer.y); cx.stroke();
    cx.setLineDash([]);
  }
  // にじむ光は最後に加算で重ねる
  cx.globalCompositeOperation = 'lighter';
  for (const l of lit) {
    const r = 18 + 26 * l.v;
    cx.globalAlpha = 0.25 + 0.75 * l.v;
    cx.drawImage(glow(l.col), l.x - r, l.y - r, r * 2, r * 2);
  }
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
