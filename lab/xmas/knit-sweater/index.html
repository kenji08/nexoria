<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knit Sweater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root { --fg: #f3eee6; --dim: rgba(243,238,230,.55); --line: rgba(243,238,230,.18); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #171310; color: var(--fg); font-family: 'Outfit', sans-serif;
               touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .top { position: fixed; top: 18px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: baseline; pointer-events: none; }
  .top a { pointer-events: auto; color: var(--dim); font-size: 12px; letter-spacing: .2em; text-decoration: none; }
  h1 { font-weight: 200; font-size: 15px; letter-spacing: .35em; }
  .bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; align-items: center; width: calc(100% - 32px); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .sw.on { border-color: var(--fg); transform: scale(1.12); }
  button { font: inherit; font-size: 12px; letter-spacing: .1em; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line);
           border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
  button.on { background: rgba(243,238,230,.18); border-color: rgba(243,238,230,.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>KNIT SWEATER</h1><a href="../">← XMAS LAB</a></div>
<div class="bar" id="bar">
  <div class="row" id="pal"></div>
  <div class="row">
    <button id="tPen" class="on">ペン</button>
    <button id="tFill">ぬりつぶし</button>
    <button id="tMirror" class="on">左右対称</button>
    <button id="bAuto">おまかせで編む</button>
    <button id="bUndo">戻す</button>
    <button id="bSave">画像で保存</button>
  </div>
</div>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const knit = document.createElement('canvas'), kx = knit.getContext('2d');
const COLS = 60, ROWS = 52, MID = 30;
const COLORS = [['生成り', '#efe6d4'], ['赤', '#b3222e'], ['緑', '#2c6a43'], ['紺', '#1c2a52'], ['金', '#d6a238'], ['こげ茶', '#5c3921'], ['ピンク', '#e3879c'], ['水色', '#86c0dc']];

function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(c, k, a = 1) { const [r, g, b] = hex(c); const f = v => Math.max(0, Math.min(255, Math.round(k > 1 ? v + (255 - v) * (k - 1) : v * k))); return `rgba(${f(r)},${f(g)},${f(b)},${a})`; }
const SH = COLORS.map(([, c]) => ({ base: c, gap: mix(c, 0.38), edge: mix(c, 0.55, 0.9), hi: mix(c, 1.35, 0.55) }));

// ── セーターの形 ──
function inPoly(x, y, p) {
  let inside = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const [xi, yi] = p[i], [xj, yj] = p[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const SLEEVE = [[16.2, 4], [1, 42], [8, 46.5], [16.2, 19]];
const mask = new Uint8Array(COLS * ROWS);   // 0=外 1=身頃 2=ゴム編み
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const x = c + 0.5, y = r + 0.5, mx = x < MID ? x : COLS - x;
  let m = 0;
  if (mx >= 16 && y >= 4) {
    const nk = ((x - MID) / 6.8) ** 2 + ((y - 3.5) / 5) ** 2;
    const shoulder = y < 4 + Math.max(0, (Math.abs(x - MID) - 6.5) * 0.12);
    if (nk < 1 || shoulder) m = 0; else m = (nk < 1.55 || y >= 48) ? 2 : 1;
  } else if (inPoly(mx, y, SLEEVE)) {
    const ax = 16, ay = 11.5, bx = 4.5, by = 44.2;
    const t = ((mx - ax) * (bx - ax) + (y - ay) * (by - ay)) / ((bx - ax) ** 2 + (by - ay) ** 2);
    m = t > 0.87 ? 2 : 1;
  }
  mask[r * COLS + c] = m;
}

let grid = new Uint8Array(COLS * ROWS).fill(1);
let color = 0, tool = 'pen', mirror = true;
const undo = [];
let dirty = true;

// ── 配置 ──
let W, H, D, cw, ch, ox, oy;
function layout() {
  D = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  cv.width = W * D; cv.height = H * D;
  const barH = document.getElementById('bar').getBoundingClientRect().height + 30;
  const aw = W - 32, ah = H - 70 - barH - 24;
  cw = Math.min(aw / COLS, ah / (ROWS * 0.82)); ch = cw * 0.82;
  ox = (W - COLS * cw) / 2; oy = 70 + 24 + (ah - ROWS * ch) / 2;
  knit.width = Math.ceil(COLS * cw * D); knit.height = Math.ceil((ROWS * ch + ch) * D);
  dirty = true;
}
addEventListener('resize', layout);

// 1目ずつ、V字の2つの山で描く
function drawKnit() {
  kx.setTransform(D, 0, 0, D, 0, 0);
  kx.clearRect(0, 0, knit.width, knit.height);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const m = mask[r * COLS + c]; if (!m) continue;
    kx.fillStyle = SH[grid[r * COLS + c]].gap; kx.fillRect(c * cw - 0.3, r * ch - 0.3, cw + 0.6, ch + 0.6);
  }
  kx.lineWidth = Math.max(0.5, cw * 0.07);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const m = mask[r * COLS + c]; if (!m) continue;
    const s = SH[grid[r * COLS + c]], rib = m === 2;
    const x = c * cw + cw / 2, y = r * ch + ch * 0.5;
    for (const k of [-1, 1]) {
      const rx = cw * (rib ? 0.22 : 0.27), ry = ch * (rib ? 0.72 : 0.66), a = k * (rib ? 0.28 : 0.55);
      const lx = x + k * cw * (rib ? 0.2 : 0.22);
      kx.fillStyle = s.base; kx.strokeStyle = s.edge;
      kx.beginPath(); kx.ellipse(lx, y, rx, ry, a, 0, Math.PI * 2); kx.fill(); kx.stroke();
      kx.fillStyle = s.hi;
      kx.beginPath(); kx.ellipse(lx - k * rx * 0.15, y - ry * 0.25, rx * 0.35, ry * 0.45, a, 0, Math.PI * 2); kx.fill();
    }
  }
}

function drawHanger() {
  const sx = ox + MID * cw, sy = oy + 4 * ch;
  cx.strokeStyle = '#8a6a48'; cx.lineWidth = Math.max(3, cw * 0.7); cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(ox + 17 * cw, sy + ch * 0.6); cx.quadraticCurveTo(sx, sy - ch * 3.5, ox + 43 * cw, sy + ch * 0.6); cx.stroke();
  cx.strokeStyle = '#b9b2a6'; cx.lineWidth = Math.max(1.5, cw * 0.3);
  cx.beginPath(); cx.moveTo(sx, sy - ch * 1.5); cx.lineTo(sx, sy - ch * 4); cx.arc(sx + ch * 1.4, sy - ch * 4, ch * 1.4, Math.PI, Math.PI * 1.9); cx.stroke();
}

let hover = null;
function render() {
  if (dirty) { drawKnit(); dirty = false; }
  cx.setTransform(D, 0, 0, D, 0, 0);
  const g = cx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.7);
  g.addColorStop(0, '#2a221c'); g.addColorStop(1, '#120e0b');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  drawHanger();
  cx.save(); cx.shadowColor = 'rgba(0,0,0,.55)'; cx.shadowBlur = 30; cx.shadowOffsetY = 12;
  cx.drawImage(knit, ox, oy, knit.width / D, knit.height / D);
  cx.restore();
  if (hover) {
    cx.strokeStyle = 'rgba(255,255,255,.7)'; cx.lineWidth = 1;
    for (const c of mirror ? [hover.c, COLS - 1 - hover.c] : [hover.c]) cx.strokeRect(ox + c * cw + 0.5, oy + hover.r * ch + 0.5, cw - 1, ch - 1);
  }
  requestAnimationFrame(render);
}

// ── 描く ──
function cellAt(e) {
  const c = Math.floor((e.clientX - ox) / cw), r = Math.floor((e.clientY - oy) / ch);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS || !mask[r * COLS + c]) return null;
  return { c, r };
}
function paint(c, r) {
  for (const cc of mirror ? [c, COLS - 1 - c] : [c]) {
    const i = r * COLS + cc;
    if (mask[i] && grid[i] !== color) { grid[i] = color; dirty = true; }
  }
}
function fill(c, r) {
  const from = grid[r * COLS + c]; if (from === color) return;
  const st = [[c, r]];
  while (st.length) {
    const [x, y] = st.pop();
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) continue;
    const i = y * COLS + x;
    if (!mask[i] || grid[i] !== from) continue;
    grid[i] = color; st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  if (mirror) { const mc = COLS - 1 - c; if (grid[r * COLS + mc] === from) fill(mc, r); }
  dirty = true;
}
function snapshot() { undo.push(grid.slice()); if (undo.length > 40) undo.shift(); }

let down = null;
cv.addEventListener('pointerdown', e => {
  const p = cellAt(e); if (!p) return;
  cv.setPointerCapture(e.pointerId); snapshot(); stopKnitting();
  if (tool === 'fill') { fill(p.c, p.r); return; }
  down = p; paint(p.c, p.r);
});
cv.addEventListener('pointermove', e => {
  const p = cellAt(e); hover = e.pointerType === 'mouse' ? p : null;
  if (!down || !p) return;
  // 速く動かしても目が飛ばないように線でつなぐ
  let x0 = down.c, y0 = down.r; const dx = Math.abs(p.c - x0), dy = Math.abs(p.r - y0), sx = x0 < p.c ? 1 : -1, sy = y0 < p.r ? 1 : -1;
  let err = dx - dy;
  for (;;) { paint(x0, y0); if (x0 === p.c && y0 === p.r) break; const e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; } }
  down = p;
});
const end = () => down = null;
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
cv.addEventListener('pointerleave', () => hover = null);

// ── 図案 ──
const MOTIFS = {
  flake: ['...#...', '.#.#.#.', '..###..', '#######', '..###..', '.#.#.#.', '...#...'],
  tree: ['...#...', '..###..', '.#####.', '..###..', '.#####.', '#######', '...#...'],
  deer: ['........#..#.', '........#.#..', '.........##..', '........####.', '........###..', '.########....', '#########....', '.########....', '.#.#...#.#...', '.#.#...#.#...'],
  oxo: ['#.....#', '.#...#.', '..#.#..', '...#...', '..#.#..', '.#...#.', '#.....#'],
  heart: ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'],
  star: ['...#...', '...#...', '#######', '.#####.', '..###..', '.##.##.', '##...##'],
};
const SCHEMES = [[1, 0, 2], [3, 0, 1], [2, 0, 1], [0, 1, 2], [3, 0, 4], [5, 0, 1], [1, 0, 4], [7, 0, 3], [6, 0, 1], [0, 3, 1]];
const pick = a => a[Math.floor(Math.random() * a.length)];

function generate() {
  const [b, f, a] = pick(SCHEMES);
  const T = new Uint8Array(COLS * ROWS).fill(b);
  const set = (c, r, v) => { if (c >= 0 && c < COLS && r >= 0 && r < ROWS) T[r * COLS + c] = v; };
  const band = {
    line: (r, col) => { for (let c = 0; c < COLS; c++) set(c, r, col); return 1; },
    dots: (r, col) => { for (let c = 0; c < COLS; c++) if ((c + (c >= MID ? 1 : 0)) % 2 === 0) set(c, r, col); return 1; },
    check: (r, col) => { for (let k = 0; k < 2; k++) for (let c = 0; c < COLS; c++) if ((c + k) % 2 === 0) set(c, r + k, col); return 2; },
    zig: (r, col) => { for (let k = 0; k < 3; k++) for (let c = 0; c < COLS; c++) { const m = ((Math.abs(c - MID + 0.5) - 0.5) % 4 + 4) % 4; if (m === k || m === 4 - k) set(c, r + k, col); } return 3; },
    motif: (r, col, name) => {
      const m = MOTIFS[name], mh = m.length, mw = m[0].length, P = mw + 3;
      for (let k = -6; k <= 6; k++) {
        const c0 = Math.round(MID - mw / 2 + k * P);
        // 右半分は鏡写しにして、向かい合わせにする
        const flip = c0 + mw / 2 > MID;
        for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (m[y][flip ? mw - 1 - x : x] === '#') set(c0 + x, r + y, col);
      }
      return mh;
    },
  };
  const names = Object.keys(MOTIFS);
  const big = pick(['deer', 'flake', 'tree', 'star', 'deer']);
  const plan = [['line', a], ['gap'], ['zig', f], ['gap'], ['motif', f, big], ['gap'], ['zig', f], ['gap'], ['line', a], ['gap'], ['dots', f], ['gap'],
    ['motif', a, pick(names.filter(n => n !== big && n !== 'deer'))], ['gap'], ['check', f], ['gap'], ['motif', f, pick(['flake', 'oxo', 'heart', 'tree'])], ['gap'], ['line', a]];
  let r = 9;
  for (const [type, col, name] of plan) {
    if (type === 'gap') { r += 1; continue; }
    const h = type === 'motif' ? MOTIFS[name].length : { line: 1, dots: 1, check: 2, zig: 3 }[type];
    if (r + h > 47) break;
    r += band[type](r, col, name);
  }
  // ゴム編みは無地で締める
  for (let i = 0; i < T.length; i++) if (mask[i] === 2) T[i] = a;
  return T;
}

// 下の段から編み上がっていく
let knitting = null;
function startKnitting(T) {
  snapshot(); stopKnitting();
  let row = ROWS - 1;
  knitting = setInterval(() => {
    for (let k = 0; k < 2 && row >= 0; k++, row--) for (let c = 0; c < COLS; c++) grid[row * COLS + c] = T[row * COLS + c];
    dirty = true;
    if (row < 0) stopKnitting();
  }, 28);
}
function stopKnitting() { if (knitting) { clearInterval(knitting); knitting = null; } }

// ── UI ──
const pal = document.getElementById('pal');
COLORS.forEach(([name, c], i) => {
  const d = document.createElement('div'); d.className = 'sw' + (i === color ? ' on' : ''); d.style.background = c; d.title = name;
  d.onclick = () => { color = i; pal.querySelectorAll('.sw').forEach((s, k) => s.classList.toggle('on', k === i)); };
  pal.appendChild(d);
});
const tPen = document.getElementById('tPen'), tFill = document.getElementById('tFill');
tPen.onclick = () => { tool = 'pen'; tPen.classList.add('on'); tFill.classList.remove('on'); };
tFill.onclick = () => { tool = 'fill'; tFill.classList.add('on'); tPen.classList.remove('on'); };
document.getElementById('tMirror').onclick = e => { mirror = !mirror; e.target.classList.toggle('on', mirror); };
document.getElementById('bAuto').onclick = () => startKnitting(generate());
document.getElementById('bUndo').onclick = () => { stopKnitting(); if (undo.length) { grid = undo.pop(); dirty = true; } };
document.getElementById('bSave').onclick = () => {
  const out = document.createElement('canvas'), pad = 40 * D;
  out.width = knit.width + pad * 2; out.height = knit.height + pad * 2;
  const o = out.getContext('2d'); o.fillStyle = '#1d1814'; o.fillRect(0, 0, out.width, out.height); o.drawImage(knit, pad, pad);
  const a = document.createElement('a'); a.download = 'xmas-sweater.png'; a.href = out.toDataURL('image/png'); a.click();
};

layout();
startKnitting(generate());
undo.length = 0;
requestAnimationFrame(render);
</script>
</body>
</html>
